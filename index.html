All 480 permanent family IDs, levels and saved Q data remain unchanged.

LEVEL_ASSIGNMENTS47 explicitly lists all 24 groups. generatorLevel47 preserves
old generator behavior when course levels change. No random renumbering at load.
QUESTION_DUPLICATES46 / QUESTION_CATALOG46 now include all four levels.

const VERSION=24, KEY='math-life-rebuilt-v24';
const $=id=>document.getElementById(id);
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const P=a=>a[R(0,a.length-1)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=R(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const round=x=>Math.round((x+Number.EPSILON)*100)/100;
const f=x=>Number.isInteger(x)?String(x):String(round(x));
const cash=x=>`${f(x)} ₪`;

function numeric(text,answer,calc,opt={}){
 answer=round(answer);const fmt=opt.fmt||cash;
 const step=opt.step||(Math.abs(answer)>100?20:Math.abs(answer)>20||(answer>=10&&answer%10===0)?10:2);
 const raw=[...(opt.wrong||[]),answer+step,answer-step,answer+2*step,answer+3*step,answer+1];
 const used=new Set([fmt(answer)]), options=[{text:fmt(answer),correct:true,value:answer}];
 for(const v0 of raw){const v=round(v0);if(!Number.isFinite(v)||(!opt.negative&&v<0)||used.has(fmt(v)))continue;options.push({text:fmt(v),correct:false,value:v});used.add(fmt(v));if(options.length===4)break;}
 if(options.length!==4)throw Error('options');
 return {text,answer,correctText:fmt(answer),calc,options:shuffle(options),fmtKind:opt.kind||'number',unit:opt.unit||'₪',note:opt.note||'',nudge:opt.nudge||'',skill:opt.skill||'',...opt.meta};
}
function choice(text,correct,wrong,calc,opt={}){
 return {text,correctText:correct,calc,options:shuffle([{text:correct,correct:true},...wrong.map(w=>typeof w==='string'?{text:w,correct:false,why:'הבחירה הזו לא מתאימה לנתונים בשאלה.'}:{...w,correct:false})]),note:opt.note||'',nudge:opt.nudge||''};
}

add(1,'portions','לחלק מרק',l=>{let size=P([200,250,300]),n=R(3,6);return count(`בסיר יש ${size*n} מ״ל מרק. כל קערה מכילה ${size} מ״ל. לכמה קערות יספיק הסיר?`,n,`${size*n} ÷ ${size} = ${n}.`,'קערות');});
add(1,'recipehalf','חצי מתכון',l=>{let a=P([200,300,400,500,600]);return count(`במתכון יש ${a} גרם קמח. מכינים חצי מהכמות. כמה גרם קמח צריך?`,a/2,`${a} ÷ 2 = ${a/2}. חצי מתכון — חצי מכל כמות.`,'גרם',{step:50});});
add(1,'snacksplit','חלוקה למנות',l=>{let total=P([12,16,20,24]),days=P([2,4]);return count(`יש ${total} עוגיות. מחלקים באופן שווה ל־${days} ימים. כמה עוגיות יש בכל מנה יומית?`,total/days,`${total} ÷ ${days} = ${total/days}. חלוקה מראש עוזרת לבחור מנה.`,'עוגיות');});
add(1,'medicine','מרווח לפי הוראה',l=>{let at=P([8,9,10,11,12,14,16,18]),gap=P([4,6,8]);return clock(`חישוב זמן: בהוראה נתונה כתוב להמתין ${gap} שעות בין מנות. מנה נלקחה ב־${time(at*60)}. מתי מסתיים המרווח?`,(at+gap)*60,`${time(at*60)} ועוד ${gap} שעות = ${time((at+gap)*60)}.`,{note:'זו אינה הוראת נטילה. בפועל פועלים לפי העלון והוראות הרופא.'});});
add(1,'routine','זמן להפסקה',l=>{let a=num(10,30,l),b=num(10,20,l),extra=num(10,30,l);return duration(`יש לך ${a+b+extra} דקות להפסקה. ארוחה לוקחת ${a} דקות ומנוחה ${b} דקות. כמה דקות נשארות למלא מים?`,extra,`${a+b+extra} − ${a} − ${b} = ${extra} דקות.`,{nudge:'משאירה זמן גם לאוכל, גם לשתייה וגם למנוחה.'});});
add(1,'refill','מים בתיק',l=>{let size=P([500,750]),need=size*P([2,3]);return count(`ליציאה תכננת ${need} מ״ל מים. הבקבוק שלך מכיל ${size} מ״ל. לכמה בקבוקים מלאים שווה הכמות?`,need/size,`${need} ÷ ${size} = ${need/size}.`,'בקבוקים',{note:waterNote});});
add(1,'breaks','הפסקות לאורך יום',l=>{let total=P([4,6,8]),gap=2;return count(`תכננת הפסקת מים בסוף כל שעתיים במהלך ${total} שעות, כולל בסיום. כמה הפסקות מופיעות בתכנון?`,total/gap,`${total} ÷ 2 = ${total/gap} הפסקות.`,'הפסקות');});
add(1,'frozenextra','תוספת למזון קפוא',l=>{let base=P([2,3,4]),extra=P([1,1.5,2]);return duration(`מנה רגילה מקבלת ${base} דקות. למנה קפואה מוסיפים ${extra} דקות. כמה דקות בסך הכול?`,base+extra,`${base} + ${extra} = ${base+extra}.`,{step:.5,note:microwaveNote});});
// 2 — Restaurants, tips and lower-cost alternatives.
function homeDish(){const n=P(['פילה סלמון','לינגוויני סלמון','בולונז','ארוחת בוקר','המבורגר']);let home,out;do{home=R(8,16);out=home*R(5,15);}while((n==='לינגוויני סלמון'&&out<70)||(n==='פילה סלמון'&&(out<96||out>144))||out>150);return{n,home,out};}
add(2,'meal','מנה ושתייה',l=>{let a=dish(l),b=snack(l);return numeric(`${a.n} עולה ${cash(a.p)} ו${b.n} עולה ${cash(b.p)}. כמה תשלמי לפני טיפ?`,a.p+b.p,`${a.p} + ${b.p} = ${a.p+b.p}.`,{note:roundNote(l)});});
add(2,'tip10','טיפ של עשירית',l=>{let a=num(100,220,l===2?1:0);return numeric(`החשבון ${cash(a)}. בחרת להשאיר טיפ של 10% — עשירית מהחשבון. כמה הטיפ?`,a/10,`מחלקים ב־10: ${a} ÷ 10 = ${f(a/10)}.`);});
add(2,'total','סכום כולל טיפ',l=>{let a=num(100,200,l===2?1:0);return numeric(`הארוחה עולה ${cash(a)}. הטיפ הוא 10%, כלומר ${cash(a/10)}. כמה תשלמי הכול יחד?`,a*1.1,`${a} + ${f(a/10)} = ${f(a*1.1)}.`,{nudge:'בודקת את המחיר יחד עם הטיפ לפני שמזמינה.'});});
add(2,'tip15','טיפ של 15 אחוז',l=>{let a=P([100,120,140,160,180,200]);return numeric(`החשבון ${cash(a)} ובחרת טיפ של 15%. 10% הם ${cash(a/10)}, ו־5% הם חצי מזה. כמה טיפ תשאירי?`,a*.15,`${a/10} + ${a/20} = ${f(a*.15)}.`);});
add(2,'room','תקציב כולל טיפ',l=>{let a=P([120,140,160,180]),budget=P([200,220,240]);return numeric(`התקציב לארוחה ${cash(budget)}. המנות ${cash(a)} והטיפ ${cash(a/10)}. כמה נשאר מהתקציב?`,budget-a*1.1,`${budget} − ${a} − ${a/10} = ${f(budget-a*1.1)}.`);});
add(2,'caesar','קיסר עם תוספת',l=>{let drinks=P([0,12,16,18]);return numeric(`סלט קיסר עולה 62 ₪ ותוספת סלמון 28 ₪.${drinks?` הוספת שתייה ב־${cash(drinks)}.`:''} כמה זה לפני טיפ?`,90+drinks,`62 + 28${drinks?' + '+drinks:''} = ${90+drinks}.`);});
add(2,'rolls','סושי לשניים',l=>{let rolls=DISHES.filter(x=>x[0].includes('רול')||x[0].includes('פוטומאקי')),a=P(rolls),b=P(rolls.filter(x=>x!==a)),pa=num(a[1],a[2],l),pb=num(b[1],b[2],l);return numeric(`${a[0]} עולה ${cash(pa)} ו${b[0]} עולה ${cash(pb)}. מזמינים אחד מכל סוג. כמה זה לפני טיפ?`,pa+pb,`${pa} + ${pb} = ${pa+pb}.`);});
add(2,'onlycoffee','רק פינוק קטן',l=>{let a=snack(l),balance=num(50,100,l);return numeric(`יצאת לקנות רק ${a.n} ב־${cash(a.p)}. ב־Pepper יש ${cash(balance)}. כמה יישאר אחר כך?`,balance-a.p,`${balance} − ${a.p} = ${balance-a.p}. גם פינוק קטן נכנס לתכנון.`);});
add(2,'homecount','כמה מנות בבית',l=>{let d=homeDish();return count(`מנת ${d.n} במסעדה עולה ${cash(d.out)}. מנה בבית עולה ${cash(d.home)}. כמה מנות בבית אפשר להכין במחיר מנה אחת במסעדה?`,d.out/d.home,`${d.out} ÷ ${d.home} = ${d.out/d.home}.`,'מנות',{note:'מחירים לדוגמה, לא הצעת מחיר.'});});
add(2,'homesave','חיסכון בארוחה',l=>{let d=homeDish(),n=R(1,3);return numeric(`${n} מנות ${d.n}: כל מנה במסעדה ${cash(d.out)}, ובבית ${cash(d.home)}. כמה חוסכים בהכנה בבית, לפני טיפ?`,n*(d.out-d.home),`למנה: ${d.out} − ${d.home} = ${d.out-d.home}. ל־${n} מנות: ${n*(d.out-d.home)} ₪.`);});
add(2,'breakfast','בוקר בבית',l=>{let home=P([8,10,12]),factor=R(5,9),out=home*factor;return numeric(`ארוחת בוקר בבית קפה עולה ${cash(out)}. אותה ארוחה בבית עולה ${cash(home)}. כמה כסף נשאר אם אוכלים בבית?`,out-home,`${out} − ${home} = ${out-home}.`,{nudge:'אפשר ליהנות מבילוי ולבחור מראש על מה להוציא.'});});
add(2,'dessert','יש מקום לקינוח',l=>{let b=P([200,220,240]),meal=P([130,150,170]),dessert=P([30,40,50]),total=(meal+dessert)*1.1;return choice(`תקציב ${cash(b)}. ארוחה ${cash(meal)}, קינוח ${cash(dessert)}, ועוד 10% טיפ על הכול. האם הכול נכנס בתקציב?`,total<=b?'כן, כולל הטיפ':'לא, עם הטיפ זה עובר',[total<=b?'לא, עם הטיפ זה עובר':'כן, כולל הטיפ','הטיפ לא נכלל בתקציב','אי אפשר לחשב'],`מנות וקינוח: ${meal+dessert}. טיפ: ${f((meal+dessert)/10)}. יחד ${cash(total)} — ${total<=b?'בתוך':'מעל'} התקציב.`);});
add(2,'splitbill','חשבון משותף',l=>{let n=P([2,3,4]),per=P([60,70,80,90]),total=n*per;return numeric(`החשבון כולל הטיפ הוא ${cash(total)}. ${n} סועדות מתחלקות שווה בשווה. כמה תשלמי?`,per,`${total} ÷ ${n} = ${per}. הטיפ כבר בתוך הסכום.`);});
add(2,'delivery','עלות משלוח',l=>{let meal=num(70,110,l),delivery=P([10,15,20]),service=P([3,5,7]);return numeric(`בהזמנה הביתה: אוכל ${cash(meal)}, משלוח ${cash(delivery)} ודמי שירות ${cash(service)}. כמה ירד מ־Pepper?`,meal+delivery+service,`${meal} + ${delivery} + ${service} = ${meal+delivery+service}.`);});
add(2,'dayhotel','טיול יום או מלון',l=>{let day=P([140,160,180,200]),factor=R(4,7),hotel=day*factor;return count(`שבת של טיול יום עולה ${cash(day)} בסך הכול. בילוי עם לילה במלון עולה ${cash(hotel)} בסך הכול. לכמה טיולי יום שווה המחיר?`,factor,`${hotel} ÷ ${day} = ${factor}.`,'טיולי יום',{nudge:'בודקים את המחיר הכולל של שתי האפשרויות.'});});
add(2,'hotelsave','פער בין מועדים',l=>{let week=P([600,650,700,750]),diff=P([200,300,400,500]);return numeric(`אותו מלון מציע לילה באמצע שבוע ב־${cash(week)}, ובסוף שבוע ב־${cash(week+diff)}. כמה חוסכים באמצע השבוע?`,diff,`${week+diff} − ${week} = ${diff}.`,{nudge:'אם התאריכים גמישים, אפשר לבחור בילוי שמתאים לתקציב.'});});
add(2,'museum','מוזיאון וקפה',l=>{let ticket=num(40,80,l),coffee=num(10,20,l),n=P([1,2]);return numeric(`${n===1?'כרטיס':'שני כרטיסים'} למוזיאון: ${cash(ticket)} לאדם. קונים גם ${n} קפה ב־${cash(coffee)} כל אחד. כמה יחד?`,n*(ticket+coffee),`${n} × (${ticket} + ${coffee}) = ${n*(ticket+coffee)}.`);});
add(2,'weeklycoffee','קפה במשך שבוע',l=>{let coffee=num(10,20,l),n=R(3,6);return numeric(`קפה בדרך עולה ${cash(coffee)}. קנית כזה ב־${n} ימים השבוע. כמה הוצאת על קפה?`,coffee*n,`${coffee} × ${n} = ${coffee*n}.`,{nudge:'הוצאות קטנות נעשות ברורות כשמחברים אותן.'});});
add(2,'roundtip','טיפ בחישוב קל',l=>{let a=P([146,154,166,174,186,194]),r=Math.round(a/10)*10;return numeric(`החשבון ${cash(a)}. לחישוב מהיר מעגלים אותו ל־${cash(r)}. כמה הם 10% מהמספר המעוגל?`,r/10,`${r} ÷ 10 = ${r/10}. זה טיפ בקירוב לפי החישוב שבשאלה.`,{note:'״בקירוב״ פירושו כמעט הסכום המדויק, לחישוב מהיר.'});});
add(2,'replace','להחליף מנה',l=>{let a=num(100,140,l),b=num(70,90,l);return numeric(`החלפת מנת סלמון ב־${cash(a)} בלינגוויני ב־${cash(b)}. כמה חסכת לפני טיפ?`,a-b,`${a} − ${b} = ${a-b}.`);});
// 3 — Budget decisions always include a concrete calculation.
add(3,'daily','העברה יומית',l=>{let per=P([30,40,50,60,70]),days=P([5,7,10,20,30]);return numeric(`כל יום נכנסים ל־Pepper ${cash(per)}. כמה ייכנסו במשך ${days} ימים, בלי תוספות?`,per*days,`${per} × ${days} = ${per*days}.`,{nudge:DAILY_HINT});});
add(3,'monthly','תוספת חודשית',l=>{let per=P([30,40,50]),extra=P([300,600]);return numeric(`בחודש של 30 ימים נכנסים ל־Pepper ${cash(per)} ביום ועוד ${cash(extra)} פעם אחת אחרי ה־10. כמה נכנס בחודש?`,per*30+extra,`${per} × 30 = ${per*30}. ועוד ${extra} = ${per*30+extra}.`,{nudge:'ההעברה היומית והתקציב החודשי הם שני חלקים של אותה תוכנית.'});});
add(3,'sameplan','אותו תקציב',l=>{let per=P([40,50,60,70]),daily=per-P([10,20]),total=per*30;return numeric(`בחודש של 30 ימים, ${cash(per)} ביום נותנים ${cash(total)}. אם מעבירים רק ${cash(daily)} ביום, איזו תוספת חודשית תשלים אותו תקציב?`,total-daily*30,`${daily} × 30 = ${daily*30}. ${total} − ${daily*30} = ${total-daily*30}.`);});
add(3,'payday','תקציב לפי משכורת',l=>{let salary=P([5700,5900,6000,6200,6600,7100]),base=1500,high=2100;return numeric(`בתוכנית שסיכמת: עד שכר של 6,000 ₪ התקציב 1,500 ₪; מעליו 2,100 ₪. השכר החודש ${cash(salary)}. מה התקציב?`,salary>6000?high:base,`${salary} ${salary>6000?'גדול מ־':'אינו גדול מ־'}6,000, לכן בתוכנית הזו התקציב ${salary>6000?high:base} ₪.`,{wrong:[1800,2400,salary>6000?base:high],note:'זהו כלל של התוכנית האישית.'});});
add(3,'saveup','לחסוך לטיפול',l=>{let cost=P([200,250,300,350]),have=P([50,100,150]),daily=P([30,40,50]);return count(`טיפול אצל מירי עולה ${cash(cost)}. שמורים לך ${cash(have)}. את שומרת עוד ${cash(daily)} ביום. תוך כמה ימים מלאים יהיה מספיק?`,Math.ceil((cost-have)/daily),`חסרים ${cost-have} ₪. אחרי ${Math.ceil((cost-have)/daily)-1} ימים עדיין אין מספיק; אחרי ${Math.ceil((cost-have)/daily)} ימים יש ${have+daily*Math.ceil((cost-have)/daily)} ₪.`,'ימים');});
add(3,'reserved','כסף שכבר מתוכנן',l=>{let total=num(400,800,0),reserved=num(100,300,0);return numeric(`ב־Pepper ${cash(total)}, אבל ${cash(reserved)} כבר שמורים לעיסוי ולטיפול שתכננת. כמה פנוי להוצאות אחרות?`,total-reserved,`${total} − ${reserved} = ${total-reserved}.`,{nudge:'מה שכבר שמור לתוכנית אחרת אינו כסף פנוי.'});});
add(3,'defer','לפני העשירי',l=>{let balance=P([100,150,200]),cost=balance+P([50,80,100]),addn=P([300,600]);return numeric(`היום ה־8: יש ${cash(balance)}. עיסוי עולה ${cash(cost)}. אחרי ה־10 צפויה תוספת של ${cash(addn)}. כמה חסר היום, לפני התוספת?`,cost-balance,`${cost} − ${balance} = ${cost-balance}.`,{nudge:'אפשר לומר: ״אקבע אחרי שההעברה תיכנס ואבדוק את התקציב״.'});});
add(3,'after10','אחרי כניסת כסף',l=>{let balance=num(100,300,0),extra=P([300,600]),cost=P([180,220,250,280]);return numeric(`אחרי ה־10 נכנסו ${cash(extra)} ל־Pepper שבו היו ${cash(balance)}. טיפול שתוכנן עולה ${cash(cost)}. כמה יישאר אחריו?`,balance+extra-cost,`${balance} + ${extra} − ${cost} = ${balance+extra-cost}.`);});
add(3,'over','חריגה חודשית',l=>{let limit=P([1500,1800,2100]),spent=limit-P([100,200,300]),cost=P([350,400,450]);return numeric(`התקציב לחודש ${cash(limit)}. כבר הוצאת ${cash(spent)}. הצעה חדשה עולה ${cash(cost)}. בכמה תעברי את התקציב אם תקני?`,spent+cost-limit,`${spent} + ${cost} − ${limit} = ${spent+cost-limit}.`,{nudge:'הנחה לא משנה את הסכום הפנוי. אפשר לדחות לחודש הבא.'});});
add(3,'credit','מסגרת אינה כסף',l=>{let used=P([2500,3200,4100,4700]);return numeric(`מסגרת האשראי 6,000 ₪, וכבר מחויבים בה ${cash(used)}. כמה נשאר במסגרת?`,6000-used,`6,000 − ${used} = ${6000-used}.`,{nudge:'מסגרת פנויה אינה תוספת למשכורת; חיובים צריך לשלם.'});});
add(3,'installments','מחיר כל התשלומים',l=>{let n=R(4,12),per=P([80,100,150,200]);return numeric(`מציעים לך סדרת טיפולים אצל סנדרה ב־${n} תשלומים של ${cash(per)}. מה המחיר המלא לפני שמחליטים?`,n*per,`${n} × ${per} = ${n*per}.`,{nudge:'אפשר לומר: ״שלחי מחיר מלא בכתב. אני לא מתחייבת עכשיו״.'});});
add(3,'interest','עלות הלוואה',l=>{let loan=P([1000,1500,2000]),extra=P([100,200,300]),total=loan+extra;return numeric(`בהצעה מקבלים ${cash(loan)} ומחזירים בסך הכול ${cash(total)}. כמה משלמים מעבר לסכום שהתקבל?`,extra,`${total} − ${loan} = ${extra}.`,{nudge:'בתוכנית שלך לא מממנים בילוי בהלוואה; חוסכים לפני הקנייה.'});});
add(3,'forother','בקשה לשלם עבור אחר',l=>{let b=num(300,600,0),spend=num(100,250,0),reserve=b-50;return numeric(`יש לך ${cash(b)}, ומתוכם ${cash(reserve)} שמורים להוצאות שלך. מבקשים שתקני עבור מישהי מוצר ב־${cash(spend)}. כמה מהכסף השמור ייפגע?`,spend-50,`פנויים רק ${b} − ${reserve} = 50. הקנייה תיקח עוד ${spend} − 50 = ${spend-50} מהכסף השמור.`,{nudge:'אפשר לומר: ״הכסף שלי כבר מתוכנן, אני לא יכולה לשלם עבורך״.'});});
add(3,'gifts','מתנת יום הולדת',l=>{let n=P([3,4,5]),per=num(30,70,l);return numeric(`את משתתפת עם עוד אנשים במתנה שעולה ${cash(n*per)}. יש ${n} משתתפים בסך הכול, והסכום מתחלק שווה. כמה לשמור ב־Pepper לחלק שלך?`,per,`${n*per} ÷ ${n} = ${per}.`);});
add(3,'reservehotel','לשמור למלון',l=>{let cost=P([600,700,800,900]),months=P([2,4,5]);return numeric(`רוצה לשמור ${cash(cost)} למלון בעוד ${months} חודשים. כמה צריך לחסוך בכל חודש, בחלקים שווים?`,cost/months,`${cost} ÷ ${months} = ${f(cost/months)}.`,{nudge:'בילוי מתוכנן מתחיל בחיסכון קטן וקבוע.'});});
add(3,'subscription','מחיר שנתי',l=>{let per=P([20,30,40,50,60]);return numeric(`בטלפון מציעים מנוי ב־${cash(per)} לחודש. כמה זה לשנה של 12 חודשים?`,per*12,`${per} × 12 = ${per*12}.`,{nudge:'אפשר לומר: ״לא מאשרת בטלפון. אבדוק אם זה ברשימה שלי״.'});});
add(3,'daysleft','לחלק את היתרה',l=>{let days=R(3,10),per=P([20,30,40,50]);return numeric(`נשארו ${cash(days*per)} לתקציב הבילויים ועוד ${days} ימים בחודש. בלי תוספות נוספות, כמה אפשר להוציא בכל יום בחלוקה שווה?`,per,`${days*per} ÷ ${days} = ${per}.`);});
add(3,'buffer','להשאיר כרית קטנה',l=>{let balance=num(200,400,0),reserve=num(50,100,0),cost=num(50,100,l);return numeric(`ב־Pepper ${cash(balance)}. את משאירה ${cash(reserve)} למשהו לא צפוי וקונה ב־${cash(cost)}. כמה עדיין פנוי מעבר לסכום ששמרת?`,balance-reserve-cost,`${balance} − ${reserve} − ${cost} = ${balance-reserve-cost}.`);});
add(3,'treatment','סדרה או טיפול בודד',l=>{let n=P([5,6,8]),single=P([180,220,250]),pack=n*(single-20);return numeric(`תכננת רק טיפול אחד ב־${cash(single)}. מציעים סדרה של ${n} טיפולים ב־${cash(pack)}. בכמה יותר כסף תתחייבי אם תקני סדרה?`,pack-single,`${pack} − ${single} = ${pack-single}.`,{nudge:'מחיר טוב לטיפול לא מחייב לקנות סדרה שלא תכננת.'});});
add(3,'massages','עיסויים בחודש',l=>{let p=P([160,180,200,220]),n=P([2,3]),budget=P([1500,2100]);return numeric(`בתקציב של ${cash(budget)} תכננת ${n} עיסויים ב־${cash(p)} כל אחד. כמה יישאר לשאר החודש?`,budget-n*p,`${n} × ${p} = ${n*p}. ${budget} − ${n*p} = ${budget-n*p}.`);});
// 4 — Time arithmetic and planning, with varied starting hours.
const hour=()=>workStart();
add(4,'halfadd','עוד חצי שעה',l=>{let t=R(7,20)*60+P([0,30]);return clock(`השעה ${time(t)}. בעוד חצי שעה יוצאים. באיזו שעה יוצאים?`,t+30,`חצי שעה היא 30 דקות. ${time(t)} + חצי שעה = ${time(t+30)}.`);});
add(4,'quarters','רבע ועוד רבע',l=>{let n=P([2,3,4,5,6]);return duration(`משימה מורכבת מ־${n} חלקים. כל חלק לוקח רבע שעה. כמה דקות ייקח הכול?`,n*15,`רבע שעה = 15 דקות. ${n} × 15 = ${n*15} דקות.`,{wrong:[n*10,n*30,n*20]});});
add(4,'departure','לצאת לעבודה',l=>{let t=hour(),walk=P(l===0?[10,20,30]:[10,15,20,25,30]);return clock(`העבודה מתחילה ב־${time(t)}. ההליכה נמשכת ${walk} דקות. מתי לצאת כדי להגיע בזמן?`,t-walk,`${time(t)} פחות ${walk} דקות = ${time(t-walk)}.`);});
add(4,'wake','מתי לקום',l=>{let t=hour(),walk=P([10,15,20]),prep=P([10,20,30]),coffee=P([5,10]);return clock(`העבודה ב־${time(t)}. צריך ${walk} דקות הליכה, ${prep} להתארגן ו־${coffee} לקפה. מתי כדאי לקום?`,t-walk-prep-coffee,`צריך ${walk}+${prep}+${coffee} = ${walk+prep+coffee} דקות. קמה ב־${time(t-walk-prep-coffee)}.`);});
add(4,'sleep','שמונה שעות שינה',l=>{let wake=P([360,390,420,450,480,510]);return clock(`מחר קמים ב־${time(wake)}. תכננת 8 שעות שינה. באיזו שעה בלילה שלפני כדאי כבר לישון?`,wake-480,`סופרים 8 שעות לאחור מ־${time(wake)}: ${time(wake-480)} בלילה שלפני.`,{nudge:'תכנון הערב משאיר מקום למנוחה לפני יום עמוס.'});});
add(4,'sleeplength','כמה ישנתי',l=>{let start=P([1260,1290,1320,1350,1380,1410]),end=P([360,390,420,450,480]);return count(`נרדמת ב־${time(start)} וקמת למחרת ב־${time(end)}. כמה שעות ישנת?`,(1440-start+end)/60,`עד חצות ${(1440-start)/60} שעות, ואחריו ${end/60}. יחד ${(1440-start+end)/60} שעות.`,'שעות',{step:.5});});
add(4,'sleepgap','כמה חסר לשינה',l=>{let actual=P([5,5.5,6,6.5,7,7.5]);return count(`תכננת 8 שעות שינה, ובפועל ישנת ${actual} שעות. כמה שעות חסרו לעומת התכנון?`,8-actual,`8 − ${actual} = ${8-actual}.`,'שעות',{step:.5});});
add(4,'shift','אורך משמרת',l=>{let start=hour(),len=P([240,300,360,420,480]);return count(`המשמרת התחילה ב־${time(start)} והסתיימה ב־${time(start+len)}. כמה שעות נמשכה?`,len/60,`מ־${time(start)} עד ${time(start+len)} עוברות ${len/60} שעות.`,'שעות',{step:1});});
add(4,'shiftbreak','שעות בלי הפסקה',l=>{let len=P([360,420,480]),pause=P([30,45,60]);return duration(`המשמרת נמשכת ${len/60} שעות ובה ${pause} דקות הפסקה. כמה דקות עבודה נשארות בלי ההפסקה?`,len-pause,`${len/60} × 60 = ${len}. ${len} − ${pause} = ${len-pause}.`);});
add(4,'finishwork','מהעבודה הביתה',l=>{let end=P([14,15,16,18,19])*60+P([0,30]),walk=P([10,15,20,25]);return clock(`סיימת לעבוד ב־${time(end)}. ההליכה הביתה לוקחת ${walk} דקות. מתי תגיעי?`,end+walk,`${time(end)} ועוד ${walk} דקות = ${time(end+walk)}.`);});
add(4,'sequence','שתי משימות',l=>{let a=P([10,15,20,25,30]),b=P([5,10,15,20]);return duration(`מקלחת לוקחת ${a} דקות, ואחריה סידור התיק ${b} דקות. כמה זמן להקצות לשתיהן?`,a+b,`${a} + ${b} = ${a+b} דקות.`,{nudge:'מכינה את התיק בנחת לפני שיוצאת.'});});
add(4,'free','חלון פנוי',l=>{let start=P([14,15,16,17])*60+P([0,15,30]),gap=P([30,45,60,75,90]);return duration(`חזרת הביתה ב־${time(start)} וצריך לצאת שוב ב־${time(start+gap)}. כמה דקות פנויות יש?`,gap,`מ־${time(start)} עד ${time(start+gap)} יש ${gap} דקות.`);});
add(4,'fits','מה מספיקים',l=>{let free=P([30,40,50,60]),meal=P([15,20,25]),rest=P([15,20,30,40]),needed=meal+rest;return choice(`יש ${free} דקות עד היציאה. ארוחה לוקחת ${meal} דקות ומנוחה ${rest}. האם יש זמן לשתיהן?`,needed<=free?'כן, יש מספיק זמן':'לא, צריך לקצר או לשנות',[needed<=free?'לא, צריך לקצר או לשנות':'כן, יש מספיק זמן','צריך רק זמן לארוחה','אי אפשר לחשב'],`צריך ${meal} + ${rest} = ${needed} דקות, ויש ${free}. ${needed<=free?'התכנון נכנס בזמן.':'התכנון ארוך מהזמן הפנוי.'}`);});
add(4,'appointment','תור והקדמה',l=>{let at=R(9,19)*60+P([0,15,30,45]),early=P([10,15,20]);return clock(`התור אצל מירי ב־${time(at)}. ביקשת להגיע ${early} דקות קודם. לאיזו שעת הגעה לתכנן?`,at-early,`${time(at)} פחות ${early} דקות = ${time(at-early)}.`);});
add(4,'delay','דחייה בזמן',l=>{let t=R(9,20)*60+P([0,15,30,45]),late=P([10,15,20,30]);return clock(`קבעת פגישה ל־${time(t)}. היא נדחתה ב־${late} דקות. מה השעה החדשה?`,t+late,`${time(t)} ועוד ${late} דקות = ${time(t+late)}.`);});
add(4,'midnight','אחרי חצות',l=>{let start=P([1380,1395,1410,1425]),len=P([60,75,90]);return clock(`סרט מתחיל ב־${time(start)} ונמשך ${len} דקות. באיזו שעה הוא נגמר?`,start+len,`עוברים את חצות ומגיעים ל־${time(start+len)} ביום הבא.`);});
add(4,'timer','הטיימר מסתיים',l=>{let t=R(9,20)*60+P([10,20,30,40]),len=P([10,20,30,40]);return clock(`התחלת טיימר של ${len} דקות בשעה ${time(t)}. מתי הוא יצלצל?`,t+len,`${time(t)} ועוד ${len} דקות = ${time(t+len)}.`);});
add(4,'decimal','שעות וחצאים',l=>{let h=P([1.5,2.5,3.5]);return duration(`תכננת ${h} שעות לפעילות. בכל שעה 60 דקות. כמה דקות זה?`,h*60,`${Math.floor(h)} שעות הן ${Math.floor(h)*60} דקות. חצי שעה עוד 30. יחד ${h*60}.`);});
add(4,'bedroutine','להתחיל להירגע',l=>{let sleep=P([21,22,23])*60+P([0,30]),routine=P([20,30,40,45]);return clock(`רוצה כבר לישון ב־${time(sleep)}. התארגנות לשינה לוקחת ${routine} דקות. מתי להתחיל?`,sleep-routine,`${time(sleep)} פחות ${routine} דקות = ${time(sleep-routine)}.`);});
add(4,'weeklyrest','מנוחה לאורך השבוע',l=>{let n=P([3,4,5,6]),per=P([15,20,30]);return duration(`השבוע תכננת ${n} הפסקות מנוחה של ${per} דקות. כמה דקות מנוחה תכננת בסך הכול?`,n*per,`${n} × ${per} = ${n*per} דקות.`);});
// 5 — Travel durations are practice data, never invented live transport schedules.
add(5,'onehour','שעה בדרך',l=>{let arrive=R(15,21)*60+P([0,30]);return clock(`הנסיעה נמשכת שעה. רוצה להגיע ב־${time(arrive)}. מתי צריך לצאת?`,arrive-60,`${time(arrive)} פחות שעה = ${time(arrive-60)}.`,{note:travelNote});});
add(5,'walkstation','להגיע לרכבת',l=>{let train=R(15,20)*60+P([10,20,30,40]),walk=P([20,25,30]),early=10;return clock(`הרכבת יוצאת ב־${time(train)}. ההליכה ליוספטל ${walk} דקות, ורוצה להגיע 10 דקות קודם. מתי לצאת?`,train-walk-early,`צריך ${walk} + 10 = ${walk+10} דקות. יוצאת ב־${time(train-walk-10)}.`,{note:travelNote});});
add(5,'busstation','אוטובוס לתחנה',l=>{let walk=P([5,10]),wait=P([5,10,15]),ride=P([10,15,20]);return duration(`מהבית בבר יהודה ליוספטל: ${walk} דקות הליכה, ${wait} המתנה ו־${ride} באוטובוס. כמה זמן יחד?`,walk+wait+ride,`${walk} + ${wait} + ${ride} = ${walk+wait+ride} דקות.`,{note:travelNote});});
BANK.push({id:'5-train',cat:5,retired:true,rank:0}); // Historical statistics only.
add(5,'lastleg','מהרכבת לרביבים',l=>{let bus=P([10,15,20]),walk=P([5,10,15]),wait=P([5,10]);return duration(`מתחנת הרכבת בהרצליה לרביבים 14: המתנה ${wait} דקות, אוטובוס ${bus}, והליכה ${walk}. כמה זמן להוסיף?`,bus+walk+wait,`${wait} + ${bus} + ${walk} = ${bus+walk+wait} דקות.`,{note:travelNote});});
add(5,'transfer','החלפת רכבת',l=>{let a=P([20,25,30]),wait=P([5,10,15]),b=P([15,20,25]);return duration(`בדרך חזרה יש החלפה: רכבת ראשונה ${a} דקות, המתנה ${wait}, ושנייה ${b}. כמה זמן כל הדרך ברכבות?`,a+wait+b,`${a} + ${wait} + ${b} = ${a+wait+b} דקות.`,{note:travelNote});});
add(5,'direct','ישירה או החלפה',l=>{let direct=P([40,45,50]),extra=P([10,15,20]);return duration(`בתכנון: נסיעה ישירה ${direct} דקות, ונסיעה עם החלפה ${direct+extra}. כמה דקות חוסכים בישירה?`,extra,`${direct+extra} − ${direct} = ${extra} דקות.`,{note:travelNote});});
add(5,'buffer','שעה ספייר',l=>{let basic=P([60,70,80,90]);return duration(`הדרך לפלמנקו נמשכת ${basic} דקות. את מוסיפה שעה שלמה ספייר לכל הדרך. כמה דקות להקצות?`,basic+60,`שעה היא 60 דקות. ${basic} + 60 = ${basic+60}.`,{note:travelNote,nudge:'ספייר מתוכנן מאפשר להגיע בלי לרוץ.'});});
add(5,'monday','לפלמנקו ביום שני',l=>{let travel=P([60,70,80,90,100]);return clock(`ביום שני הפלמנקו ב־20:45. הדרך ${travel} דקות, ועוד שעה ספייר. מתי לצאת?`,1245-travel-60,`צריך ${travel+60} דקות. 20:45 פחות הזמן הזה = ${time(1245-travel-60)}.`,{note:travelNote});});
add(5,'wednesday','לפלמנקו ביום רביעי',l=>{let travel=P([55,65,75,85,95]);return clock(`ביום רביעי הפלמנקו ב־18:45. הדרך ${travel} דקות, ועוד שעה ספייר. מתי לצאת?`,1125-travel-60,`צריך ${travel+60} דקות. 18:45 פחות הזמן הזה = ${time(1125-travel-60)}.`,{note:travelNote});});
add(5,'wait','כמה זמן המתנה',l=>{let arrive=R(15,20)*60+P([5,15,25,35]),wait=P([5,10,15,20]);return duration(`הגעת לתחנה ב־${time(arrive)}. האוטובוס יוצא ב־${time(arrive+wait)}. כמה דקות תחכי?`,wait,`מ־${time(arrive)} עד ${time(arrive+wait)} יש ${wait} דקות.`,{note:travelNote});});
add(5,'miss','הרכבת הבאה',l=>{let t=R(15,21)*60+P([0,15,30]),gap=P([15,20,30]);return clock(`הרכבת יצאה ב־${time(t)}. הבאה יוצאת ${gap} דקות אחריה. באיזו שעה?`,t+gap,`${time(t)} ועוד ${gap} דקות = ${time(t+gap)}.`,{note:travelNote});});
add(5,'ravkav','יתרת רב־קו',l=>{let balance=P([30,40,50,60]),fare=P([8,10,12,15]);return numeric(`ברב־קו יש ${cash(balance)}. מחיר נסיעה ${cash(fare)}. כמה יישאר אחרי הלוך וחזור באותו מחיר?`,balance-2*fare,`שתי נסיעות: ${fare} × 2 = ${fare*2}. נשאר ${balance-2*fare} ₪.`,{note:'זהו מחיר לתרגול, לא תעריף נסיעה עדכני.'});});
add(5,'topup','כמה להטעין',l=>{let per=P([10,12,15]),trips=P([4,5,6]),have=P([10,20,30]);return numeric(`מתוכננות ${trips} נסיעות ב־${cash(per)} כל אחת. ברב־קו ${cash(have)}. כמה כסף חסר לכל הנסיעות?`,trips*per-have,`${trips} × ${per} = ${trips*per}. חסרים ${trips*per} − ${have} = ${trips*per-have}.`,{note:'זהו מחיר לתרגול, לא תעריף נסיעה עדכני.'});});
add(5,'fromwork','מהבית או מהעבודה',l=>{let work=P([15,20,25]),home=work+P([10,15,20]);return duration(`מהעבודה ליוספטל הולכים ${work} דקות, ומהבית ${home} דקות. כמה זמן חוסכים ביציאה מהעבודה?`,home-work,`${home} − ${work} = ${home-work} דקות.`,{note:travelNote});});
add(5,'roundtrip','הלוך וחזור',l=>{let a=P([60,70,80,90]),b=P([50,60,70,80]);return duration(`הדרך להרצליה ${a} דקות והחזרה ${b} דקות. כמה דקות נסיעה יש בסך הכול?`,a+b,`${a} + ${b} = ${a+b} דקות.`,{note:travelNote});});
add(5,'arriveearly','זמן עד השיעור',l=>{let classAt=P([1125,1245]),early=P([15,20,30,45]);return duration(`הגעת לפלמנקו ב־${time(classAt-early)}. השיעור ב־${time(classAt)}. כמה דקות נשארו עד השיעור?`,early,`מ־${time(classAt-early)} עד ${time(classAt)} יש ${early} דקות.`,{nudge:'הגעה מוקדמת משאירה זמן למים ולהתארגנות.'});});
add(5,'homeafter','חוזרת מהשיעור',l=>{let end=P([1200,1230,1320,1350]),ride=P([50,60,70,80]);return clock(`השיעור הסתיים ב־${time(end)}. כל הדרך הביתה נמשכת ${ride} דקות. מתי תגיעי?`,end+ride,`${time(end)} ועוד ${ride} דקות = ${time(end+ride)}${end+ride>=1440?' ביום הבא':''}.`,{note:travelNote});});
add(5,'remainingbuffer','כמה ספייר נשאר',l=>{let delay=P([10,15,20,25,30,40]);return duration(`יצאת עם שעה ספייר. בדרך היה עיכוב של ${delay} דקות. כמה דקות ספייר נשארו?`,60-delay,`שעה = 60 דקות. ${60} − ${delay} = ${60-delay}.`,{note:travelNote});});
add(5,'connection','האם מספיקים להחלפה',l=>{let gap=P([5,10,15,20]),walk=P([7,12,17]),at=R(15,20)*60;return choice(` הגעת ב־${time(at)}. הרכבת הבאה ב־${time(at+gap)}, והמעבר לוקח ${walk} דקות. האם תספיקי בלי לרוץ?`,walk<=gap?'כן, יש מספיק זמן':'לא, צריך לתכנן רכבת אחרת',[walk<=gap?'לא, צריך לתכנן רכבת אחרת':'כן, יש מספיק זמן','כדאי להניח שלא צריך זמן למעבר','אי אפשר להשוות זמנים'],`יש ${gap} דקות עד הרכבת, ונדרשות ${walk}. ${walk<=gap?'המעבר נכנס בזמן.':'זמן המעבר ארוך מהזמן שיש.'}`,{note:travelNote});});
// A family's intrinsic number of steps controls sampling as well as the changing numbers.
const RANKS=[
 [0,0,0,0,1,0,1,1,0,2,0,1,1,2,1,1,2,1,2,2],

// Catalogue rows have a different practical question, not just a different product name.
// A = unit price/count, B = count, C = reserve/fee; T and D derived transparently.
function scenario(cat,id,title,kind,unit,text,note=''){
 const ranks={add:0,sub:0,mul:0,div:1,remain:1,extra:1,ceil:2,half:0,discount:1,twogroups:2};
 extra(cat,id,title,ranks[kind]??1,l=>{
  let A=unit==='₪'?num(10,80,l):P([2,3,4,5,6,8,10]),B=R(2,l===2?4:3),C=unit==='₪'?num(10,40,l):R(1,5);
  if(unit==='דקות'){A=P([10,15,20]);C=P([5,10]);}
  if(unit==='מ״ל'){A=num(100,400,0);C=num(50,150,0);}
  if(unit==='שעות')A=R(2,5);
  if(title==='מספר תבניות ביצים')A=P([6,12,18]);
  if(title==='דמי שקיות')C=l===0?10:R(1,3);
  if(cat===2&&unit==='₪'){
   if(/מלון/.test(title))A=num(500,900,l);
   else if(title==='מחיר ארוחה לזוג')A=num(70,120,l);
   else if(title==='משקאות לקבוצה'||title==='חיסכון בהבאת מים')A=num(10,20,l);
   else if(title==='קינוח משותף')A=num(10,20,l);
   else if(/כרטיס/.test(title))A=num(40,100,l);
  }
  const T=A*B,D=A+C+B*(unit==='₪'?10:unit==='מ״ל'?50:unit==='דקות'?5:1),H=A*2;let answer,calc;
  switch(kind){
   case 'add':answer=A+C;calc=`${A} + ${C} = ${answer}.`;break;
   case 'sub':answer=D-C;calc=`${D} − ${C} = ${answer}.`;break;
   case 'mul':answer=T;calc=`${A} × ${B} = ${answer}.`;break;
   case 'div':answer=A;calc=`${T} ÷ ${B} = ${answer}.`;break;
   case 'remain':answer=T-A;calc=`${T} − ${A} = ${answer}.`;break;
   case 'extra':answer=T+C;calc=`${A} × ${B} + ${C} = ${answer}.`;break;
   case 'ceil':answer=B+1;calc=`${T+1} לא מתחלק בדיוק ב־${A}; ${B} יחידות אינן מספיקות, צריך ${B+1}.`;break;
   case 'half':answer=A;calc=`${H} ÷ 2 = ${A}.`;break;
   case 'discount':answer=round(T*.9);calc=`10% מ־${T} הם ${f(T/10)}. ${T} − ${f(T/10)} = ${f(answer)}.`;break;
   case 'twogroups':answer=T+H;calc=`${A} × ${B} + ${H} = ${answer}.`;break;
  }
  const values={A,B,C,T,D,H,X:T+1};const qtext=text.replace(/\{([A-Z])\}/g,(_,k)=>values[k]);
  return numeric(qtext,answer,calc,{fmt:unit==='₪'?cash:x=>`${f(x)} ${unit}`,unit,step:unit==='₪'?10:1,note,meta:{audit:{kind,A,B,C,T,D,H}}});
 });
}

timeExtra(5,'תיק לפני פלמנקו',l=>{let at=P([1125,1245]),way=P([60,75,90]),bag=P([5,10,15]);return clock(`פלמנקו ב־${time(at)}. הדרך ${way} דקות ועוד שעה ספייר. סידור התיק ${bag} דקות. מתי להתחיל לסדר?`,at-way-60-bag,`מורידים ${way+60+bag} דקות מ־${time(at)}. התוצאה ${time(at-way-60-bag)}.`,{note:travelNote});});
timeExtra(6,'שתי משמרות בשבוע',l=>{let [a,b]=workPair(),[c,d]=workPair();return duration(`עבדת יום אחד מ־${time(a)} עד ${time(b)}, וביום אחר מ־${time(c)} עד ${time(d)}. כמה דקות יחד?`,b-a+d-c,`${b-a} + ${d-c} = ${b-a+d-c} דקות.`);});
timeExtra(7,'זמן מהעבודה לרכבת',l=>{let end=P(WORK_ENDS),w=P([20,25,30]);return clock(`יצאת מהעבודה בבת ימון ב־${time(end)}. ההליכה ליוספטל ${w} דקות. מתי תגיעי לתחנה?`,end+w,`${time(end)} ועוד ${w} דקות = ${time(end+w)}.`,{note:travelNote});});
timeExtra(8,'בדיקת הקדמה למשמרת',l=>{let at=workStart(),early=P([5,10,15,20]);return duration(`הגעת לבת ימון ב־${time(at-early)}. העבודה מתחילה ב־${time(at)}. כמה דקות הקדמת?`,early,`ההפרש הוא ${early} דקות.`);});
timeExtra(9,'כמה נשאר מההפסקה',l=>{let all=P([20,30,40]),eat=P([10,15]);return duration(`בהפסקת העבודה יש ${all} דקות. אכלת במשך ${eat}. כמה דקות נשארו?`,all-eat,`${all} − ${eat} = ${all-eat} דקות.`);});
timeExtra(10,'ארוחה אחרי העבודה',l=>{let end=P(WORK_ENDS),walk=P([10,15,20]),heat=P([3,4,5]);return clock(`סיימת בבת ימון ב־${time(end)}. הליכה הביתה ${walk} דקות וחימום ארוחה ${heat} דקות לפי התכנון. מתי הארוחה מוכנה?`,end+walk+heat,`מוסיפים ${walk+heat} דקות. הארוחה מוכנה ב־${time(end+walk+heat)}.`);});
timeExtra(11,'הבדל בין ימי פלמנקו',l=>{let way=P([60,75,90]);return clock(`ביום שני השיעור ב־20:45 וביום רביעי ב־18:45. ברביעי צריך ${way+60} דקות לדרך ולספייר. מתי לצאת ברביעי?`,1125-way-60,`18:45 פחות ${way+60} דקות = ${time(1125-way-60)}.`,{note:travelNote});});
timeExtra(12,'זמן נסיעה לשבוע',l=>{let one=P([60,70,80,90]);return duration(`לכל כיוון לפלמנקו מתוכננות ${one} דקות. נוסעים הלוך וחזור בשני וברביעי. כמה דקות דרך בשבוע?`,one*4,`שני ימים × שני כיוונים × ${one} = ${one*4}.`,{note:travelNote});});
timeExtra(13,'שינה לפני משמרת מוקדמת',l=>{let start=P([435,450,465,480]),prep=P([30,45,60]),wake=start-prep;return clock(`העבודה ב־${time(start)}. צריך לקום ${prep} דקות קודם. לשמונה שעות שינה, מתי כבר לישון?`,wake-480,`קמה ב־${time(wake)}. שמונה שעות קודם: ${time(wake-480)}.`);});
timeExtra(14,'חלון בין עבודה לפלמנקו',l=>{let end=P([840,900,960]),depart=1125-P([120,135]);return duration(`סיימת בבת ימון ב־${time(end)}. היציאה המתוכננת לפלמנקו היא ב־${time(depart)}. כמה דקות יש ביניהן?`,depart-end,`מ־${time(end)} עד ${time(depart)} יש ${depart-end} דקות.`);});
timeExtra(15,'הליכות במהלך יום עבודה',l=>{let a=P([10,15,20]),b=P([10,15,25]);return duration(`הלכת ${a} דקות לעבודה ו־${b} דקות בחזרה. כמה דקות הליכה היו ביום?`,a+b,`${a} + ${b} = ${a+b}.`);});
timeExtra(16,'זמן שתי הפסקות במשמרת',l=>{let a=P([5,10,15]),b=P([10,15,20]);return duration(`במשמרת היו הפסקות של ${a} ושל ${b} דקות. כמה דקות הפסקה בסך הכול?`,a+b,`${a} + ${b} = ${a+b}.`);});
timeExtra(17,'רכבת אחרי התארגנות',l=>{let at=P(WORK_ENDS),pack=P([5,10]),walk=P([20,25]);return clock(`סיימת בבת ימון ב־${time(at)}. ${pack} דקות לסידור התיק ו־${walk} ליוספטל. מתי תגיעי?`,at+pack+walk,`מוסיפים ${pack+walk} דקות: ${time(at+pack+walk)}.`,{note:travelNote});});
timeExtra(18,'זמן שהתפנה בשינוי משמרת',l=>{let old=P([960,1080,1140]),now=old-60;return clock(`במקום לסיים ב־${time(old)}, מסיימים שעה קודם. באיזו שעה יוצאים מהמשמרת?`,now,`${time(old)} פחות שעה = ${time(now)}.`);});
timeExtra(19,'הארכת משמרת בהסכמה',l=>{let old=P([840,900,1080]),more=P([30,60]);return clock(`המשמרת תוכננה להסתיים ב־${time(old)}, והתארכה ב־${more} דקות. מתי היא נגמרת?`,old+more,`${time(old)} ועוד ${more} דקות = ${time(old+more)}.`);});

// Professional arithmetic, not clinical recommendations. Every datum is supplied in the question.
const th=(id,title,rank,gen)=>extra(5,'professional-'+id,title,rank,l=>{
 const q=gen(l);q.note=q.note||therapyNote;q.nudge=q.nudge||'רושמת את הנתונים, בודקת את החשבון, ומסבירה להורים בביטחון.';return q;
});
const tm=(l,a=10,b=30)=>l===0?P([10,20,30].filter(n=>n>=a&&n<=b)):R(a/5,b/5)*5;
const atTime=()=>P([540,570,600,630,660,720,780,810,840,870,900,960,1020]);
const fee=l=>P([150,200,250]);
th('age-months','רישום גיל בחודשים',0,l=>{let y=R(1,5),m=l?P([0,3,6,9]):0,n=y*12+m;return count(`בטופס נרשם גיל ${y} שנים${m?' ועוד '+m+' חודשים':''}. כמה חודשים לרשום בסך הכול?`,n,`${y} × 12${m?' + '+m:''} = ${n} חודשים.`,'חודשים');});
th('months-years','מחודשים לשנים',0,l=>{let y=R(2,12),n=y*12;return count(`בתיק כתוב גיל ${n} חודשים. כמה שנים מלאות זה?`,y,`בכל שנה 12 חודשים. ${n} ÷ 12 = ${y}.`,'שנים');});
th('age-gap','פער גיל בין ילדים',0,l=>{let a=R(6,24),d=R(2,9);return count(`בקבוצה ילד בן ${a} חודשים וילדה בת ${a+d} חודשים. מה פער הגיל בחודשים?`,d,`${a+d} − ${a} = ${d}.`,'חודשים');});
th('future-age','גיל במעקב הבא',0,l=>{let a=R(3,30),b=R(1,4);return count(`התינוק בן ${a} חודשים היום. פגישת מעקב נקבעה לעוד ${b} חודשים. בן כמה יהיה אז?`,a+b,`${a} + ${b} = ${a+b} חודשים.`,'חודשים');});
th('past-age','גיל בתחילת המעקב',1,l=>{let a=R(9,36),b=R(2,6);return count(`הילדה בת ${a} חודשים. התחלת לתעד לפני ${b} חודשים. בת כמה הייתה בתחילת התיעוד?`,a-b,`${a} − ${b} = ${a-b} חודשים.`,'חודשים');});
th('weeks-days','רישום שבועות וימים',1,l=>{let w=R(2,9),d=R(1,6);return count(`בטופס תיעוד הגיל הוא ${w} שבועות ועוד ${d} ימים. כמה ימים בסך הכול?`,w*7+d,`${w} × 7 + ${d} = ${w*7+d}.`,'ימים');});
th('week-followup','מרווח מעקב בשבועות',0,l=>{let w=R(2,8);return count(`עברו בדיוק ${w*7} ימים בין שתי תצפיות. כמה שבועות עברו?`,w,`${w*7} ÷ 7 = ${w} שבועות.`,'שבועות');});
th('months-left','כמה חודשים עד גיל נתון',0,l=>{let target=P([12,18,24,36,48]),d=R(2,7);return count(`הילד בן ${target-d} חודשים. כמה חודשים נשארו עד גיל ${target} חודשים?`,d,`${target} − ${target-d} = ${d}.`,'חודשים');});
th('table-range','אורך טווח בחומר הלימוד',1,l=>{let [a,b]=P([[6,10],[7,9],[10,15],[12,18],[18,24]]);return count(`בחומר הלימוד מופיע טווח גיל ${a}–${b} חודשים. מה ההפרש בין תחילת הטווח לסופו?`,b-a,`${b} − ${a} = ${b-a} חודשים.`,'חודשים',{note:suppliedTableNote});});
th('table-mid','אמצע טווח גיל',2,l=>{let [a,b]=P([[6,10],[7,9],[12,18],[18,24]]);return count(`בחומר הלימוד, הטווח הוא ${a}–${b} חודשים. איזה גיל נמצא בדיוק באמצע?`,(a+b)/2,`חצי מהמרחק הוא ${(b-a)/2}. מוסיפים ל־${a}: ${(a+b)/2}.`,'חודשים',{note:suppliedTableNote});});
th('session-end','שעת סיום מפגש',0,l=>{let a=atTime(),d=tm(l);return clock(`מפגש ספורט טיפולי מתחיל ב־${time(a)} ואורכו ${d} דקות לפי היומן. מתי הוא מסתיים?`,a+d,`${time(a)} ועוד ${d} דקות = ${time(a+d)}.`);});
th('session-start','תכנון תחילת מפגש',0,l=>{let end=atTime(),d=tm(l);return clock(`המפגש צריך להסתיים ב־${time(end)}. הוקצו לו ${d} דקות. מתי להתחיל?`,end-d,`${time(end)} פחות ${d} דקות = ${time(end-d)}.`);});
th('parent-brief','זמן שנותר לשיחת הורים',0,l=>{let a=tm(l),b=tm(l),left=tm(l),total=a+b+left;return duration(`במערך לדוגמה הוקצו ${total} דקות: ${a} לפתיחה ו־${b} לפעילות. כמה נשאר להדרכת הורים?`,left,`${total} − ${a} − ${b} = ${left} דקות.`);});
th('three-parts','בדיקת אורך מערך',0,l=>{let a=tm(l),b=tm(l),c=tm(l);return duration(`במערך לימודי: ${a} דקות פתיחה, ${b} דקות פעילות ו־${c} דקות סיכום. כמה דקות יש במערך?`,a+b+c,`${a} + ${b} + ${c} = ${a+b+c}.`);});
th('buffer','מרווח בין משפחות',1,l=>{let a=atTime(),session=P([30,40,45]),gap=P([10,15,20]);return clock(`משפחה מגיעה ב־${time(a)} למפגש של ${session} דקות. אחריו שמרת ${gap} דקות לסידור ותיעוד. מתי אפשר לקבוע את המשפחה הבאה?`,a+session+gap,`סיום ב־${time(a+session)}. ועוד ${gap} דקות: ${time(a+session+gap)}.`);});
th('late-arrival','מפגש שהתחיל באיחור',1,l=>{let full=P([30,40,50]),late=P([5,10,15]);return duration(`הוקצו ${full} דקות למפגש. המשפחה איחרה ${late} דקות ושעת הסיום נשארה קבועה. כמה זמן נשאר?`,full-late,`${full} − ${late} = ${full-late} דקות.`,{nudge:'מסבירה את הזמן שנותר ברוגע ובבהירות.'});});
th('half-session','מחצית מפגש',0,l=>{let full=P([20,40,60]);return duration(`מפגש של ${full} דקות מחולק לשני חלקים שווים. כמה דקות בכל חלק?`,full/2,`${full} ÷ 2 = ${full/2} דקות.`);});
th('quarter-hour','רבעי שעה במערך',1,l=>{let n=R(2,4);return duration(`במערך הלימודי נרשמו ${n} מקטעים של רבע שעה. כמה דקות יחד?`,n*15,`רבע שעה = 15 דקות. ${n} × 15 = ${n*15}.`);});
th('massage-record','תיעוד מסאז׳ מרגיע',0,l=>{let a=l?R(2,6):10,b=l?R(2,6):20;return duration(`ביומן לדוגמה נרשמו שני מקטעי מסאז׳ מרגיע לתינוק: ${a} ו־${b} דקות. כמה דקות תועדו יחד?`,a+b,`${a} + ${b} = ${a+b} דקות.`,{note:'סיכום יומן מדומה בלבד; זו אינה המלצה למשך מסאז׳ לתינוק.'});});
th('pause-record','זמן פעילות ללא הפסקות',1,l=>{let total=P([30,40,50]),pause=P([5,10,15]);return duration(`בתיעוד המפגש נרשמו ${total} דקות בסך הכול, כולל ${pause} דקות הפסקה. כמה דקות היו ללא ההפסקה?`,total-pause,`${total} − ${pause} = ${total-pause}.`);});
th('sleep-night','משך שינה ביומן',1,l=>{let start=P([1200,1230,1260,1290]),hours=P([8,9,10]),end=start+hours*60;return count(`ביומן מדומה נרשמה שינה מ־${time(start)} עד ${time(end)} למחרת, ללא יקיצות. כמה שעות נרשמו?`,hours,`מ־${time(start)} עד חצות ${(1440-start)/60} שעות; ואחר כך ${(end-1440)/60}. יחד ${hours}.`,'שעות');});
th('sleep-awake','הפחתת זמן ערות',1,l=>{let total=P([480,540,600]),awake=P([20,30,40,60]);return duration(`ביומן: ${total} דקות מתחילת הלילה לסופו, ובהן ${awake} דקות ערות. כמה דקות שינה תועדו?`,total-awake,`${total} − ${awake} = ${total-awake}.`);});
th('naps','סיכום תנומות מהיומן',0,l=>{let a=tm(l,10,30),b=tm(l,10,30),c=tm(l,10,30);return duration(`הורה תיעד שלוש תנומות: ${a}, ${b} ו־${c} דקות. מה הסכום לתיעוד?`,a+b+c,`${a} + ${b} + ${c} = ${a+b+c} דקות.`,{note:'אלה נתוני יומן מדומה, לא יעד שינה.'});});
th('sleep-average','ממוצע מתועד',2,l=>{let a=P([8,9,10]),n=R(3,5);return count(`ביומן של ${n} לילות נרשמו יחד ${a*n} שעות שינה. כמה שעות בממוצע ללילה?`,a,`מחלקים את הסך במספר הלילות: ${a*n} ÷ ${n} = ${a}.`,'שעות');});
th('diary-gap','מרווח בין רישומים',0,l=>{let a=atTime(),gap=P([30,60,90,120]);return duration(`בטופס תזונה יש רישום ב־${time(a)} ורישום נוסף ב־${time(a+gap)}. כמה דקות עברו ביניהם?`,gap,`ההפרש בין השעות הוא ${gap} דקות.`,{note:'חישוב מרווח ביומן בלבד, לא הנחיית האכלה.'});});
th('nutrition-total','סיכום כמויות מהיומן',0,l=>{let a=num(60,140,0),b=num(60,140,0);return count(`בטופס מדומה נרשמו כמויות של ${a} מ״ל ו־${b} מ״ל. כמה מ״ל לרשום בסיכום?`,a+b,`${a} + ${b} = ${a+b} מ״ל.`,'מ״ל',{note:'נתוני רישום בלבד, לא המלצה לכמות האכלה.'});});
th('record-missing','השלמת שורת סיכום',1,l=>{let a=num(60,140,0),b=num(60,140,0);return count(`בסיכום יומן נרשמו ${a+b} מ״ל בשני רישומים. בראשון ${a} מ״ל. כמה נרשמו בשני?`,b,`${a+b} − ${a} = ${b} מ״ל.`,'מ״ל',{note:'בדיקת רישום בלבד, לא כמות מומלצת.'});});
th('diary-complete','כיסוי יומן הורים',1,l=>{let days=R(5,14),done=R(2,days-1);return count(`ביקשת למלא יומן למשך ${days} ימים לפי התכנית שסוכמה. מולאו ${done}. כמה ימים עדיין חסרים?`,days-done,`${days} − ${done} = ${days-done}.`,'ימים');});
th('forms-check','בדיקת טפסים',0,l=>{let n=R(8,20),missing=R(1,4);return count(`בתיק ${n} טופסי תיעוד. ב־${missing} חסר תאריך. כמה טפסים כוללים תאריך?`,n-missing,`${n} − ${missing} = ${n-missing}.`,'טפסים');});
th('record-rate','אחוז ביצוע בתצפית',2,l=>{let total=P([10,20]),done=R(2,total-1);return count(`בתצפית לימודית בוצעו ${done} מתוך ${total} ניסיונות. איזה אחוז בוצע?`,done/total*100,`${done} ÷ ${total} × 100 = ${done/total*100}%.`,'%',{note:'אחוז מתוך ניסיונות מתועדים בלבד; אינו ציון התפתחותי.'});});
th('fee-total','תשלום למספר מפגשים',0,l=>{let p=fee(l),n=R(2,5);return numeric(`מחיר מפגש שסוכם עם ההורים הוא ${p} ₪. התקיימו ${n} מפגשים. מה הסכום בחשבון?`,p*n,`${p} × ${n} = ${p*n} ₪.`,{note:'מחיר לדוגמה בלבד, לא מחירון מקצועי.'});});

 if(!['+','-'].includes(operator))throw Error('Unsupported approximation operation');
 let answer=operator==='+'?rounded.reduce((a,b)=>a+b,0):rounded[0]-rounded[1];
 const hints=values.map((n,i)=>`${n} ≈ ${rounded[i]}`).join(', ');
 return numeric(text,answer,`${hints}. ${rounded.join(' '+operator+' ')} = ${answer} ₪ בקירוב.`,{fmt:x=>`כ־${f(x)} ₪`,step:20,note:'כאן מחשבים בערך. המחיר בקופה או בחשבון נשאר מדויק.',...opt,meta:{approx:{values,rounded,operator,answer}}});

function refreshPendingTherapy(q){
 if(!q||q.answered||!THERAPY_UPDATED.has(q.tpl)||q.sessionPlan)return q;
 const t=BANK.find(t=>t.id===q.tpl);let next;
 for(let i=0;i<45;i++){
  next=t.gen(q.level);const sig=t.id+'|'+next.text+'|'+next.correctText;
  if(!seen.has(sig)||i===44){seen.add(sig);break;}
 }
 return Object.assign(next,{tpl:t.id,cat:t.cat,level:q.level,title:t.title,answered:false,chosen:null});
}

function arithmeticHint(q){

 }
 if(q.calc.length>90||!/^\d[\d,. ]* [−+×÷]/.test(q.calc))return q.calc;

sport('sleep-missing-page','יומן שינה לשיחה עם הורים',0,l=>{const n=P([5,7,10]),done=P([2,3,4]);return count(`לקראת שיחת ההורים מתכננים להביא רישום של ${n} לילות. יש כבר רישום של ${done} לילות. כמה רישומים חסרים?`,n-done,`${n} − ${done} = ${n-done} רישומים.`,'רישומים');});
sport('massage-parent-time','זמן לשאלות על מסאז׳',0,l=>{const full=P([50,60]),other=P([30,40]);return duration(`מפגש הדרכת הורים על מסאז׳ מרגיע לתינוק נמשך ${full} דקות. להסבר ולהדגמה נקבעו יחד ${other} דקות. כמה נשאר לשאלות ההורים?`,full-other,`${full} − ${other} = ${full-other} דקות. זמן המפגש כולל הדרכה, ולא מסאז׳ רצוף.`);});
sport('massage-pause','רישום זמן מגע ומנוחה',1,l=>{const elapsed=P([6,8,10]),pause=P([2,3]);return duration(`ביומן מסאז׳ לתינוק נרשמו ${elapsed} דקות מתחילת החלק עד סופו, כולל ${pause} דקות הפסקה. כמה דקות מגע נרשמו?`,elapsed-pause,`${elapsed} − ${pause} = ${elapsed-pause} דקות. זה סיכום רישום, לא משך מומלץ.`);});
sport('massage-towels','הכנה להדרכת מסאז׳',0,l=>{const n=P([3,4,5]),spare=P([2,3]);return count(`להדרכת מסאז׳ תינוקות מגיעות ${n} משפחות. מכינים מגבת לכל משפחה ועוד ${spare} מגבות חלופיות. כמה מגבות להכין?`,n+spare,`${n} + ${spare} = ${n+spare} מגבות.`,'מגבות');});
sport('nutrition-bought','בדיקת קנייה לסדנת הורים',0,l=>{const n=P([4,6,8]),price=5;return numeric(`להדרכת הורים על קריאת מחירים קנית ${n} גביעי יוגורט, כל אחד ב־${price} ₪. כמה לרשום בהוצאות?`,n*price,`${n} × ${price} = ${n*price} ₪.`);});
sport('nutrition-correction','תיקון סכום בטופס תזונה',1,l=>{const a=P([60,80,100]),b=P([40,60,80]),error=20;return count(`בטופס נרשמו ${a} מ״ל ועוד ${b} מ״ל. בסיכום כתוב בטעות ${a+b+error} מ״ל. בכמה הסיכום גבוה מדי?`,error,`הסכום הנכון: ${a} + ${b} = ${a+b}. ההפרש הוא ${error} מ״ל.`,'מ״ל');});
sport('nutrition-days','כמה ימים מתועדים',0,l=>{const total=P([5,7,10]),missing=P([1,2,3]);return count(`ביומן התזונה ${total} ימים. ב־${missing} מהם לא נרשם מה נאכל. לכמה ימים יש רישום?`,total-missing,`${total} − ${missing} = ${total-missing} ימים.`,'ימים');});
sport('parent-followup','פגישה להמשך המעקב',0,l=>{const start=P([2,3,4,5]),weeks=P([1,2,3]);return count(`פגישת המעקב ב־${start} לחודש. ההמשך נקבע בעוד ${weeks} שבועות. בכל שבוע 7 ימים. באיזה יום בחודש הפגישה הבאה?`,start+weeks*7,`${weeks} שבועות הם ${weeks*7} ימים. ${start} + ${weeks*7} = ${start+weeks*7}.`,'לחודש');});
sport('parent-refund','החזר מוסכם להורים',0,l=>{const paid=P([200,250,300]),correct=paid-50;return numeric(`ההורים העבירו ${paid} ₪. המחיר שסוכם היה ${correct} ₪. כמה להחזיר?`,50,`${paid} − ${correct} = 50 ₪. בודקים יחד את הרישום ומחזירים את ההפרש.`);});
sport('parent-receipts','בדיקת שתי קבלות',1,l=>{const first=P([150,200,250]),second=P([150,200,250]),paid=first+second;return numeric(`להורה שתי קבלות: ${first} ₪ ו־${second} ₪. כמה שילם בסך הכול?`,paid,`${first} + ${second} = ${paid} ₪.`);});
sport('parent-times','חלוקת זמן לשאלות',0,l=>{const n=P([2,3,4]),each=P([5,10]);return duration(`בסיום הדרכה קבוצתית נשארו ${n*each} דקות לשאלות של ${n} הורים, בחלוקה שווה. כמה דקות לכל הורה?`,each,`${n*each} ÷ ${n} = ${each} דקות.`);});
sport('parent-forms','מידע מהבית ומהמפגש',0,l=>{const home=P([2,3,4]),session=P([2,3,4]);return count(`לסיכום המעקב יש ${home} רישומים מהבית ו־${session} מהמפגשים. כמה רישומים לבדוק יחד עם ההורים?`,home+session,`${home} + ${session} = ${home+session} רישומים.`,'רישומים');});
sport('plan-balance','חלקי מפגש שמתאימים לשעה',1,l=>{const full=P([50,60]),opening=10,activity=P([20,30]),closing=full-opening-activity;return duration(`למפגש ספורט טיפולי נקבעו ${full} דקות: ${opening} לשיחה ראשונה, ${activity} לפעילות מותאמת והשאר לסיכום עם ההורים. כמה דקות לסיכום?`,closing,`${full} − ${opening} − ${activity} = ${closing} דקות.`);});
sport('plan-preparation','הכנה לפני המשפחה',0,l=>{const at=P([540,600,660,900]),prep=P([10,20,30]);return clock(`משפחה מגיעה למפגש של שעה ב־${time(at)}. להכנת החדר צריך ${prep} דקות. מתי להתחיל להכין?`,at-prep,`${time(at)} פחות ${prep} דקות = ${time(at-prep)}.`);});
sport('plan-documentation','זמן לרישום מקצועי',1,l=>{const n=P([2,3,4]),each=P([5,10]);return duration(`אחרי כל אחד מ־${n} מפגשי ספורט טיפולי שמרת ${each} דקות לרישום. כמה דקות לרישום ביומן בסך הכול?`,n*each,`${n} × ${each} = ${n*each} דקות.`);});

// Household teaching fixtures supplied by the user. Do not randomize capacities.
const WATER_TOOLS=Object.freeze({
 san:Object.freeze({id:'san',name:'בקבוק סאן בנדטו',plural:'בקבוקי סאן בנדטו',ml:1500}),
 neviot:Object.freeze({id:'neviot',name:'בקבוק נביעות',plural:'בקבוקי נביעות',ml:1500}),
 bowl:Object.freeze({id:'bowl',name:'קערה',plural:'קערות',ml:700}),
 large:Object.freeze({id:'large',name:'כוס גדולה',plural:'כוסות גדולות',ml:500}),
 medium:Object.freeze({id:'medium',name:'כוס בינונית',plural:'כוסות בינוניות',ml:300}),
 small:Object.freeze({id:'small',name:'כוס קרטון קטנה',plural:'כוסות קרטון קטנות',ml:200})
});
const CUP_KEYS=['large','medium','small'];
const waterCup=l=>WATER_TOOLS[P(l===0?['large','small']:CUP_KEYS)];
const waterBottle=()=>WATER_TOOLS[P(['san','neviot'])];
const vesselCount=(v,n)=>n===1?v.name:`${n} ${v.plural}`;
const waterUnit=v=>`${v.name} מכילה ${v.ml} מ״ל`;
const mlNumber=n=>n.toLocaleString('en-US');
const litreName=n=>({'0.5':'חצי ליטר','1':'ליטר אחד','1.5':'ליטר וחצי','2':'2 ליטרים','2.5':'2 ליטרים וחצי','3':'3 ליטרים','3.5':'3 ליטרים וחצי','4':'4 ליטרים','4.5':'4 ליטרים וחצי','6':'6 ליטרים'}[n]||`${f(n)} ליטרים`);
const HYDRATION_NOTE='הכמויות הן דוגמה לחישוב, לא יעד שתייה אישי.';
const HYDRATION_NUDGE='שתייה לאורך היום עוזרת למנוע התייבשות. בחום ובפעילות ייתכן שצריך יותר.';
const MICRO_NOTE='זמן לדוגמה בלבד; החימום בפועל תלוי במכשיר ובמזון. משתמשים בכלי מתאים למיקרו.';
const waterSeason=()=>{const summer=Math.random()<.5;return{season:summer?'קיץ':'חורף',base:summer?2000:1500};};
function waterAmount(text,answer,calc,meta={},opt={}){
 return count(text,answer,calc,'מ״ל',{step:100,...opt,meta:{water:meta}});
}
function waterPlan(text,answer,calc,meta){return waterAmount(text,answer,calc,meta,{note:HYDRATION_NOTE,nudge:HYDRATION_NUDGE});}
function waterRev(id,title,gen){revise(id,title,gen);BANK.find(t=>t.id===id).waterFamily=true;}
function waterNew(id,title,rank,gen){extra(1,'water-'+id,title,rank,gen);BANK.at(-1).waterFamily=true;}
waterRev('1-waterleft','כמה נשאר בתכנון היומי',l=>{const p=waterSeason(),drunk=P([500,700,900,1000,1200]);return waterPlan(`ליום ${p.season} תכננת ${mlNumber(p.base)} מ״ל מים. עד עכשיו שתית ${drunk} מ״ל. כמה נשאר עד הכמות שתכננת?`,p.base-drunk,`מורידים את מה שכבר שתית: ${p.base} − ${drunk} = ${p.base-drunk} מ״ל.`,{kind:'left',...p,drunk});});
waterRev('1-cups','סופרת כוסות מוכרות',l=>{const cup=waterCup(l),n=R(2,l===2?5:4);return waterAmount(`במהלך היום שתית ${vesselCount(cup,n)}. ${waterUnit(cup)}. כמה מ״ל שתית?`,cup.ml*n,`${n} × ${cup.ml} = ${n*cup.ml} מ״ל.`,{kind:'cups',vessels:[{...cup,n}]});});
waterRev('1-mixedcups','גדולה, בינונית וקטנה',l=>{const keys=shuffle(CUP_KEYS).slice(0,2),a=WATER_TOOLS[keys[0]],b=WATER_TOOLS[keys[1]],n=R(1,2),m=R(1,l===2?3:2);return waterAmount(`שתית ${vesselCount(a,n)} (${a.ml} מ״ל כל אחת), ועוד ${vesselCount(b,m)} (${b.ml} מ״ל כל אחת). כמה מ״ל יחד?`,a.ml*n+b.ml*m,`הכוסות הראשונות: ${a.ml*n}. האחרות: ${b.ml*m}. יחד ${a.ml*n} + ${b.ml*m} = ${a.ml*n+b.ml*m} מ״ל.`,{kind:'mixed',vessels:[{...a,n},{...b,n:m}]});});
waterRev('1-bottles','כמה מים נותרו בבקבוק',l=>{const bottle=waterBottle(),cup=waterCup(l),n=P([1,2]),poured=cup.ml*n;return waterAmount(`${bottle.name} מלא מכיל 1,500 מ״ל. מזגת ממנו ${vesselCount(cup,n)}, ${cup.ml} מ״ל בכל כוס. כמה נשאר בבקבוק?`,1500-poured,`מזגת ${n} × ${cup.ml} = ${poured} מ״ל. נשארו 1,500 − ${poured} = ${1500-poured} מ״ל.`,{kind:'bottle-left',bottle:{...bottle},vessels:[{...cup,n}],poured});});
waterRev('1-liters','ליטרים במילים פשוטות',l=>{const liters=P(l===0?[.5,1,1.5,2]:[.5,1,1.5,2,2.5,3,3.5]),whole=Math.floor(liters),half=liters%1;
 return waterAmount(`ליטר אחד הוא 1,000 מ״ל. כמה מ״ל הם ${litreName(liters)}?`,liters*1000,`${whole?`${whole} × 1,000 = ${whole*1000}`:''}${half?(whole?'; ועוד חצי ליטר, 500 מ״ל.':'חצי מ־1,000 הוא 500 מ״ל.') :'.'} יחד ${mlNumber(liters*1000)} מ״ל.`,{kind:'liters',liters});});
waterRev('1-fillcups','כמה כוסות להשלמה',l=>{const cup=waterCup(l),n=R(2,l===2?5:4),amount=cup.ml*n;return count(`בתכנון השתייה נשארו ${mlNumber(amount)} מ״ל. ${waterUnit(cup)}. כמה כוסות כאלה ישלימו את הכמות?`,n,`${amount} ÷ ${cup.ml} = ${n} כוסות.`,'כוסות',{note:HYDRATION_NOTE,meta:{water:{kind:'fillcups',amount,vessels:[{...cup,n}]}}});});
waterRev('1-portions','קערות מרק בגודל קבוע',l=>{const n=P(l===0?[2,3,4]:[2,3,4,5,6]),bowl=WATER_TOOLS.bowl;return count(`בסיר ${mlNumber(700*n)} מ״ל מרק מבושל. כל קערה מכילה 700 מ״ל. כמה קערות מלאות אפשר למזוג?`,n,`${700*n} ÷ 700 = ${n} קערות.`,'קערות',{meta:{water:{kind:'portions',total:700*n,vessels:[{...bowl,n}]}}});});
waterRev('1-refill','בקבוקים מוכנים לקבוצה',l=>{const n=P([2,3,4]),bottle=waterBottle();return count(`מכינה מים לקבוצה: ${mlNumber(n*1500)} מ״ל בסך הכול. ${bottle.name} מלא מכיל 1,500 מ״ל. כמה בקבוקים כאלה להכין?`,n,`${n*1500} ÷ 1,500 = ${n} בקבוקים.`,'בקבוקים',{meta:{water:{kind:'refill',bottle:{...bottle},n,total:n*1500}}});});
waterRev('1-breaks','זוכרת הפסקות מים',l=>{const hours=P([2,3,4]),gap=P(l===0?[60]:[30,60]),minutes=hours*60;return count(`ביומן סימנת הפסקת מים כל ${gap} דקות במשך ${hours} שעות, כולל בסיום. כמה הפסקות סימנת?`,minutes/gap,`${hours} שעות הן ${minutes} דקות. ${minutes} ÷ ${gap} = ${minutes/gap} הפסקות.`,'הפסקות',{nudge:'אפשר לשתות גם בין ההפסקות. לא מחכה לסוף הפעילות.',meta:{water:{kind:'breaks',hours,gap}}});});
// Cooking cups are explicitly measuring cups, not the drinking vessels above.
replaceGen('1-home-8',l=>{const full=P([4,6,8]);return count(`במתכון לעוגה צריך ${full} כוסות מדידה של קמח. מכינים חצי מהמתכון. כמה כוסות מדידה של קמח צריך?`,full/2,`בחצי מתכון לוקחים חצי מהקמח: ${full} ÷ 2 = ${full/2} כוסות מדידה.`,'כוסות מדידה',{fmt:n=>n===1?'כוס מדידה אחת':`${f(n)} כוסות מדידה`});});
// Heating examples use convenient half minutes; capacity never changes for easier maths.
const MICRO_PROFILES=Object.freeze([
 Object.freeze({id:'medium',name:'כוס בינונית',ml:300,minutes:1}),
 Object.freeze({id:'large',name:'כוס גדולה',ml:500,minutes:1.5}),
 Object.freeze({id:'bowl',name:'קערת מרק מבושל',ml:700,minutes:3})
]);
const microProfile=()=>P(MICRO_PROFILES);
const microOptions=meta=>({step:.5,note:MICRO_NOTE,meta:{micro:meta}});
waterRev('1-microvolume','כוסות חמות בחצאי דקות',l=>{const p=P(MICRO_PROFILES.slice(0,2)),n=P(l===0?[2,3]:[2,3,4]);return duration(`בתוכנית החימום שלך, ${p.name} של ${p.ml} מ״ל מתחממת בערך ${f(p.minutes)} דקות. מחממים ${n} כוסות, אחת אחרי השנייה. כמה דקות לפי התוכנית?`,p.minutes*n,`${n} × ${p.minutes} = ${p.minutes*n} דקות.`,microOptions({kind:'batch',profile:p,n}));});
waterRev('1-micropress','לחיצות לחימום כוס או קערה',l=>{const p=microProfile();return count(`${p.name} של ${p.ml} מ״ל: זמן הדוגמה הוא בערך ${f(p.minutes)} דקות. כל לחיצה במיקרו מוסיפה חצי דקה. כמה לחיצות יתנו את הזמן הזה?`,p.minutes*2,`בכל דקה שתי לחיצות. ${p.minutes} × 2 = ${p.minutes*2} לחיצות.`,'לחיצות',{note:MICRO_NOTE,meta:{micro:{kind:'press',profile:p}}});});
waterRev('1-microwinter','עוד חצי דקה בחורף',l=>{const p=microProfile();return duration(`בתוכנית שלך מחממים ${p.name} (${p.ml} מ״ל) בערך ${f(p.minutes)} דקות. ביום חורף מוסיפים חצי דקה. כמה זמן מכוונים לפי התוכנית?`,p.minutes+.5,`${p.minutes} + 0.5 = ${p.minutes+.5} דקות.`,microOptions({kind:'winter',profile:p,extra:.5}));});
waterRev('1-microremain','משלימה את זמן החימום',l=>{const p=microProfile(),winter=Math.random()<.5,target=p.minutes+(winter?.5:0),have=P(Array.from({length:target*2-1},(_,i)=>(i+1)/2));return count(`לפי התוכנית צריך ${f(target)} דקות לחימום ${p.name} (${p.ml} מ״ל). כבר הגדרת ${f(have)} דקות. כל לחיצה מוסיפה חצי דקה. כמה לחיצות חסרות?`,(target-have)*2,`חסרות ${target-have} דקות. ${target-have} × 2 = ${(target-have)*2} לחיצות.`,'לחיצות',{note:MICRO_NOTE,meta:{micro:{kind:'remain',profile:p,target,have}}});});
waterRev('1-soup','שתי קערות בזמנים שונים',l=>{const regular=3,frozen=P([4,4.5,5]);return duration(`שתי קערות של 700 מ״ל מרק מבושל. לפי תוכנית החימום: לקערה מהמקרר ${regular} דקות ולקערה הקפואה ${frozen} דקות. מחממים בנפרד. כמה דקות יחד?`,regular+frozen,`${regular} + ${frozen} = ${regular+frozen} דקות.`,microOptions({kind:'soup',ml:700,regular,frozen}));});
// Twelve additional families. Amounts vary; containers, units and stated rules do not.
waterNew('season-difference','ההבדל בין חורף לקיץ',1,l=>{const days=P(l===0?[1,2]:[1,2,3]);return waterPlan(`בדוגמה: 1,500 מ״ל ליום בחורף ו־2,000 בקיץ. בכמה גדלה הכמות המתוכננת ${days===1?'ביום אחד':`במשך ${days} ימים`}?`,500*days,`ליום אחד: 2,000 − 1,500 = 500 מ״ל. ${days===1?'ליום אחד':`ל־${days} ימים`}: ${days} × 500 = ${days*500}.`,{kind:'season-difference',winter:1500,summer:2000,days});});

const STATION_NOTE='דוגמה לחלוקת זמן. את הפעילות ואת המנוחה מתאימים לילד.';
function stationPlan(l,{parent=false,adjustable=false}={}){
 const count=P([4,5]),maxLong=parent?(count===5?0:2):(count===5?1:3);
 const longs=P(Array.from({length:maxLong+(adjustable?0:1)},(_,i)=>i+(adjustable?1:0)));
 const minutes=shuffle(Array.from({length:count},(_,i)=>i<longs?15:10)),activity=minutes.reduce((a,b)=>a+b,0);
 const minimumExtra=parent?10:5,full=P([45,50,55,60].filter(n=>n>=activity+minimumExtra));
 // For parent conversations keep five minutes of rest; the remaining reserve is their conversation.
 const pause=parent?5:full-activity,parents=parent?full-activity-pause:0;
 return{count,minutes,activity,pause,parents,duration:full};
}
const stationText=p=>`${p.count} תחנות: ${p.minutes.join(', ')} דקות`;

 'מסבירה מראש מה כלול וכמה משלמים בסך הכול.',
 'מחיר ברור עוזר להורים להחליט בנחת.',
 'בודקת את החשבון לפני שמציגה אותו להורים.',
 'אפשר לתת זמן לחשוב. הנחה אינה מחייבת להחליט מיד.'
];

 'הגנה מלחץ שיווקי: בודקת את כל העלות לפני שמסכימות.',
 '״תשלמי אחר כך״ משנה את המועד, לא את המחיר.',
 'אפשר לומר: ״תודה, שלחו לי מחיר מלא. אבדוק בנחת״.',
 'כרטיס הפינוקים שומר גבול גם כשמציעים תשלום מאוחר.',
 'קונה רק מה שתוכנן ונכנס בתקציב, גם כשיש הנחה.'
];
const seriesRate=l=>P([150,200]);
const seriesFamilies=l=>P(l===0?[1,1,2]:[1,2,3]);
const seriesOptions=(kind,data={},opt={})=>({step:100,note:SERIES_NOTE,nudge:P(OFFER_NUDGES),...opt,meta:{offer:{side:'professional',kind,...data,plan:SERIES_PLAN}}});
const defenceOptions=(kind,data={},opt={})=>({step:50,nudge:P(DEFENCE_NUDGES),...opt,meta:{offer:{side:'consumer',kind,...data}}});
function seriesNew(id,title,rank,gen){th('series-'+id,title,rank,gen);BANK.at(-1).offerFamily=true;}
function defenceNew(id,title,rank,gen){extra(3,'offer-'+id,title,rank,gen);BANK.at(-1).offerFamily=true;}

// Display-only unit aliases. Stored answers and arithmetic always stay numeric.
function friendlyTimeText(s){
 const dual={חודשים:'חודשיים',ימים:'יומיים',שבועות:'שבועיים',שנים:'שנתיים'};
 s=s.replace(/(^|[^\d.,])2 (חודשים|ימים|שבועות|שנים)(?=$|[^א-ת])/g,(_,p,u)=>p+dual[u]);
 s=s.replace(/(^|[^א-ת])(?:שני|שתי) (חודשים|ימים|שבועות|שנים)(?=$|[^א-ת])/g,(_,p,u)=>p+dual[u]);
 // Keep explicit conversion statements and arithmetic such as "36 − 24 = 12 חודשים".
 s=s.replace(/^12 חודשים$/,'שנה');
 s=s.replace(/(בן |בת |גיל |בעוד |במשך |לפני |לאורך |עוד )12 חודשים(?=$|[^א-ת])/g,'$1שנה');
 s=s.replace(/([בלמכ])־(חודשיים|יומיים|שבועיים|שנתיים)/g,'$1$2');
 return s;
}
function ageTimeContext(d){
 const gap=d.age-d.reference;
 if(gap<=0)return null;
 let kind,text;
 if(gap*3===d.age){kind='third';text='בחישוב הזמן: הפער הוא שליש מגיל הילד.';}
 else if(gap*4===d.age){kind='quarter';text='בחישוב הזמן: הפער הוא רבע מגיל הילד.';}
 else if(gap*2>=d.age){kind='half-or-more';text='בחישוב הזמן: הפער הוא לפחות חצי מגיל הילד.';}
 else if(gap*4>d.age){kind='over-quarter';text='בחישוב הזמן: הפער גדול מרבע מגיל הילד.';}
 else if(gap*10<=d.age){kind='small-part';text='בחישוב הזמן: הפער הוא חלק קטן מהגיל כולו.';}
 else {kind='under-quarter';text='בחישוב הזמן: הפער קטן מרבע מגיל הילד.';}
 return{gap,age:d.age,kind,text};
}

developmentalCase=function(g,index,level){
 const [domain,skill]=g.skills[index],offset=P(level===0?[2,3,4,6]:[-2,-1,0,1,2,3,4,6,9,12]);
 const age=g.age+offset,over=Math.max(0,offset),second=level>0&&Math.random()<.4?P(g.skills.filter((s,j)=>j!==index&&s[0]!==domain&&motorSkill(g,j))):null;
 let missing=second?[skill,second[1]]:[skill];const known=[P(g.known)];
 const ageName=age===12?'שנה (12 חודשים)':age===18?'שנה וחצי (18 חודשים)':ageLabel(age,level>0);
 const question=offset>0?'כמה חודשים עברו מאז הגיל בטבלה?':offset<0?'עוד כמה חודשים יהיה בגיל שבטבלה?':'כמה חודשים מפרידים בין שני הגילים?';

 const makeText=()=>`ילד בן ${ageName}.\nכבר יכול: ${known.join(', ')}.\nעדיין לא: ${missing.join('; ')}.\nבטבלת ההתפתחות, רבים עושים זאת בגיל ${g.age} חודשים.\n${context?context.text+'\n':''}${question}`;
 let text=makeText();
 if(friendlyTimeText(text).length>260&&missing.length>1){missing=[skill];text=makeText();}
 const areas=[...new Set([domain,...(missing.length>1?[second[0]]:[])])].join(' ו');
 const calc=developmentExplanation({age,reference:g.age,offset,over});
 const q=count(text,Math.abs(offset),calc,'חודשים',{step:level===0?2:3,note:context?'זו השוואת זמן בלבד, לא קביעה של חומרת קושי. כשיש חשש פונים לאיש מקצוע.':'כשיש חשש להתפתחות, פונים לאיש מקצוע.',nudge:'גם פער קצר בזמן אינו סיבה לדחות בירור של יכולת שחסרה.'});
 q.dev={age,reference:g.age,over,areas,missing,offset,known};q.source=devSource(g);q.plainDevelopment=true;
 if(context)q.ageContext=context;
 return q;
};

// v37: familiar arithmetic with money scale, a fixed teaching exchange rate and purchasing power.
const UPDATED37=new Set(),CHANGES37=[];
const n37=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const shekel37=n=>`${n37(n)} ₪`;
const FX37=3,FX_NOTE37='דולר אחד = 3 שקלים לצורך המשחק בלבד; השער בפועל משתנה.';
const ASSET_NOTE37='הסכומים הם דוגמאות, לפני עלויות ומסים. דירה, זהב וקרן מניות יכולים גם לרדת בשווי.';
function update37(id,title,rank,pattern,gen){
 const t=BANK.find(t=>t.id===id);if(!t||t.retired||t.cat!==3)throw Error('Missing finance family '+id);
 CHANGES37.push({id,oldTitle:t.title,title,oldRank:t.rank,rank,oldPattern:t.practicePattern,pattern});
 Object.assign(t,{title,rank,practicePattern:pattern,practicePatternName:PATTERN_GROUPS31.find(g=>g.key===pattern)?.name||title,usefulness32:1});
 t.gen=l=>{const q=gen(l);q.plainLanguage=17;return q;};UPDATED37.add(id);
}
function number37(text,answer,calc,plan,opt={}){
 return numeric(text,answer,calc,{fmt:shekel37,step:10,...opt,meta:{finance37:plan}});
}

 q.finance37={kind:'scaleCategory',amount,unit:scale.unit,label:scale.label};return q;
});

// v38: familiar savings and pension examples; values supplied by the user are teaching inputs.
const UPDATED38=new Set(),CHANGES38=[];
const PENSION_NOTE38='הסכומים להמחשה, ולא קריאה של החשבון האישי. רווח בפנסיה נשאר בחיסכון ואינו משכורת לחשבון.';
const FUND_NOTE38='4% הם הנחה לשאלה, לא תשואה מובטחת של הראל. החישוב לפני מס וללא הפקדות או משיכות.';
function update38(id,title,rank,pattern,gen,priority=1){
 const t=BANK.find(t=>t.id===id);if(!t||t.retired||t.cat!==3)throw Error('Missing family '+id);
 CHANGES38.push({id,oldTitle:t.title,title,oldRank:t.rank,rank,oldPattern:t.practicePattern,pattern});
 Object.assign(t,{title,rank,practicePattern:pattern,practicePatternName:PATTERN_GROUPS31.find(g=>g.key===pattern)?.name||title,usefulness32:priority});
 t.gen=l=>{const q=gen(l);q.plainLanguage=17;return q;};UPDATED38.add(id);
}
function number38(text,answer,calc,plan,opt={}){return numeric(text,answer,calc,{fmt:shekel37,step:100,...opt,meta:{finance38:plan}});}
function fund38(principal){
 const one=principal/100,gain=one*4;
 return number38(`בדוגמה, נשארו בהראל כספית ${shekel37(principal)} במשך שנה שלמה. נניח שהרווח בשנה היה 4% — ארבעה שקלים לכל מאה. כמה הרווח בשקלים?`,gain,
 `אחוז אחד: ${n37(principal)} ÷ 100 = ${one} ₪.\nארבעה אחוזים: ${one} × 4 = ${gain} ₪.\nזה הרווח לשנה שלמה, לא לחודש.`,{kind:'fundReturn',principal},
 {step:50,note:FUND_NOTE38,nudge:'קרן כספית משקיעה לזמן קצר, למשל בפיקדונות ובאג״ח קצרות. הסיכון נמוך יחסית, אך הרווח אינו קבוע או מובטח.'});
}
