add40(0,'offer-cap','הנחה עם גבול ברור','discount-with-cap',l=>{const price=P([200,300,400]),cap=P([10,20]),raw=price/10,discount=Math.min(cap,raw);return money40(`קנייה מתוכננת עולה ${price} ₪. הקופון נותן 10% הנחה, אבל לא יותר מ־${cap} ₪. כמה משלמים?`,price-discount,`10% מהמחיר: ${price} ÷ 10 = ${raw} ₪.\nלפי הגבול, ההנחה היא ${discount} ₪.\nלתשלום: ${price} − ${discount} = ${price-discount} ₪.`);});
// Home and cooking: conversions, overlapping preparation and adapting quantities.
add40(1,'two-lasagnas','לזניה לסעודה ותזכורת להסרת הכיסוי','parallel-cooking-time',l=>{const meal=P([1080,1140]),bake=P([40,50]),rest=10,before=10,start=meal-rest-bake;return clock(`שתי תבניות לזניה נאפות יחד ${bake} דקות, ונחות 10 דקות לפני האכילה ב־${time(meal)}. מסירים כיסוי 10 דקות לפני סוף האפייה. באיזו שעה צריכה לצלצל התזכורת להסרת הכיסוי?`,meal-rest-before,`האפייה מסתיימת ב־${time(meal-rest)}.\nהתזכורת 10 דקות קודם: ${time(meal-rest-before)}.\nכדי להספיק, מתחילה לאפות ב־${time(start)}.`,{note:COOKING_NOTE34});});
add40(1,'soup-resume','ממשיכה מרק לפי הזמן שכבר עבר','cooking-remaining-stages',l=>{const a=P([10,15]),b=P([10,20]),c=5,done=5;return duration(`אחרי הרתיחה מתוכננות עוד ${a} דקות, אחריהן ${b} דקות ולבסוף ${c} דקות. כבר עברו ${done} דקות מהשלב הראשון. כמה זמן נשאר עד הכיבוי לפי התוכנית?`,a+b+c-done,`הזמן המתוכנן: ${a} + ${b} + ${c} = ${a+b+c} דקות.\nמורידה את הזמן שעבר: ${a+b+c} − ${done} = ${a+b+c-done} דקות.`,{note:COOKING_NOTE34});});
add40(1,'double-soup','מים לשני סירים, אחרי מה שכבר יש','double-volume-shortage',l=>{const per=P([2,3]),have=1500;return numeric(`לכל סיר מרק צריך ${per} ליטר מים. מכינה שני סירים, וכבר הוספת בסך הכול בקבוק של ${have} מ״ל. כמה מ״ל עוד להוסיף לשניהם יחד?`,per*2000-have,`לשני סירים: ${per} × 2 = ${per*2} ליטרים.\nבמ״ל: ${per*2} × 1000 = ${per*2000} מ״ל.\nחסרים: ${per*2000} − ${have} = ${per*2000-have} מ״ל.`,{fmt:n=>`${n} מ״ל`,unit:'מ״ל',step:500});});
add40(1,'portion-next-day','מחלקת לזניה ומשאירה למחר','portions-reserve-share',l=>{const portions=P([8,10,12]),tomorrow=2,people=2;return count(`הלזניה חולקה ל־${portions} מנות שוות. שומרת ${tomorrow} מנות למחר ואת השאר מחלקת שווה לשני אנשים. כמה מנות לכל אחד היום?`,(portions-tomorrow)/people,`להיום: ${portions} − ${tomorrow} = ${portions-tomorrow} מנות.\nלכל אחד: ${portions-tomorrow} ÷ 2 = ${(portions-tomorrow)/2} מנות.`,'מנות');});
add40(1,'scale-remove','הוספת יותר מדי, מתקנת בשקילה','scale-target-difference',l=>{const bowl=P([200,300]),need=P([150,200]),extra=P([20,30]),actual=bowl+need+extra;return numeric(`הקערה הריקה שוקלת ${bowl} גרם. צריך בה ${need} גרם גבינה, אבל המשקל מראה ${actual} גרם. כמה גרם גבינה להוציא?`,extra,`המשקל הרצוי עם הקערה: ${bowl} + ${need} = ${bowl+need} גרם.\nהעודף: ${actual} − ${bowl+need} = ${extra} גרם.`,{fmt:n=>`${n} גרם`,unit:'גרם',step:10});});
add40(1,'recipe-three-halves','מתכון גדול בחצי','recipe-one-and-half',l=>{const base=P([200,400,600]);return numeric(`מתכון ל־4 מנות דורש ${base} גרם גבינה. רוצה להכין 6 מנות באותו יחס: מתכון שלם ועוד חצי מתכון. כמה גבינה צריך?`,base+base/2,`לחצי מתכון: ${base} ÷ 2 = ${base/2} גרם.\nשלם ועוד חצי: ${base} + ${base/2} = ${base+base/2} גרם.`,{fmt:n=>`${n} גרם`,unit:'גרם',step:100});});
add40(1,'meal-parallel','מנצלת זמן שבו האוכל בתנור','parallel-prep-max',l=>{const bake=P([30,40]),prep=10,table=10;return duration(`הכנת האוכל לפני התנור נמשכת ${prep} דקות, והאפייה ${bake} דקות. בזמן האפייה מסדרים שולחן במשך ${table} דקות. כמה זמן עובר מתחילת ההכנה עד שהכול מוכן?`,prep+bake,`קודם הכנה: ${prep} דקות.\nהשולחן מסתדר בתוך זמן האפייה, בלי להוסיף זמן.\n${prep} + ${bake} = ${prep+bake} דקות.`,{note:COOKING_NOTE34});});
add40(1,'extra-water','התוכנית התארכה, מוסיפה מים','water-plan-change',l=>{const drank=P([500,1000]),base=2000,extra=500,prepared=1500,short=Math.max(0,base+extra-drank-prepared);return numeric(`בתוכנית השתייה שלך להיום ${base} מ״ל. נוספה הליכה והתוכנית עודכנה בעוד ${extra} מ״ל. כבר שתית ${drank} מ״ל ובתיק ${prepared} מ״ל. כמה עוד להכין כדי להשלים את התוכנית?`,short,`התוכנית החדשה: ${base} + ${extra} = ${base+extra} מ״ל.\nכבר נשתה ומוכן: ${drank} + ${prepared} = ${drank+prepared} מ״ל.\n${base+extra} − ${drank+prepared} = ${short} מ״ל להוספה.`,{fmt:n=>`${n} מ״ל`,unit:'מ״ל',step:500,note:'זו תוכנית נתונה לחישוב, לא יעד שתייה אישי לכולם.'});});
add40(1,'micro-batches','שני חימומים עם זמן ערבוב','microwave-batches-pause',l=>{const heat=P([2,3]),stir=1;return duration(`יש שתי קערות לחמם בנפרד. לכל קערה נקבעו ${heat} דקות, ובין הקערות צריך דקה לערבוב ולהחלפה. כמה דקות להקדיש לכל הפעולה?`,heat*2+stir,`שני חימומים: 2 × ${heat} = ${heat*2} דקות.\nעם ההחלפה: ${heat*2} + ${stir} = ${heat*2+stir} דקות.`,{note:'משתמשים בכלי מתאים ופועלים לפי הוראות החימום; הזמן כאן נתון לשאלה.'});});
add40(1,'recipe-budget','חסר מצרך, בודקת גם את התקציב','recipe-cost-substitute',l=>{const budget=P([50,60]),basket=budget-30,per=10,premium=40;return choice(`לארוחה שמרת ${budget} ₪. שאר המצרכים עולים ${basket} ₪. חסרה גבינה: צריך שתי חבילות ב־10 ₪, או חבילה חלופית ב־40 ₪ שמספיקה לאותה כמות. שתיהן מתאימות למתכון. מה נכנס בתקציב?`,'שתי החבילות ב־10 ₪ כל אחת',['החבילה ב־40 ₪','שתי האפשרויות נכנסות','אף אפשרות אינה נכנסת'],`לגבינה נשאר: ${budget} − ${basket} = 30 ₪.\nשתי החבילות: 2 × 10 = 20 ₪.\n20 ₪ מספיקים; 40 ₪ גבוהים מהיתרה.\nעם הבחירה נשארים: 30 − 20 = 10 ₪.`);});
// Eating out: a complete bill and meaningful alternatives.
add40(2,'two-dishes-tip','שתי מנות וטיפ בתוך התקציב','two-dishes-tip-budget',l=>{const a=P([70,80]),b=P([60,70]),bill=a+b,tip=bill/10,budget=200;return money40(`מנה אחת ${a} ₪ ומנה שנייה ${b} ₪. מוסיפה טיפ של 10% על שתי המנות. התקציב ${budget} ₪. כמה נשאר אחרי התשלום והטיפ?`,budget-bill-tip,`המנות: ${a} + ${b} = ${bill} ₪.\nהטיפ: ${bill} ÷ 10 = ${tip} ₪.\nיחד: ${bill} + ${tip} = ${bill+tip} ₪.\nנשאר: ${budget} − ${bill+tip} = ${budget-bill-tip} ₪.`);});
add40(2,'discount-tip','הנחה ואחריה טיפ','discount-then-tip',l=>{const bill=P([100,200,300]),discount=bill/10,after=bill-discount,tip=after/10;return money40(`המנות עולות ${bill} ₪. יש הנחה של 10% על המנות. החלטת לתת טיפ של 10% מהסכום שאחרי ההנחה. כמה תשלמי כולל הטיפ?`,after+tip,`ההנחה: ${bill} ÷ 10 = ${discount} ₪.\nאחרי ההנחה: ${bill} − ${discount} = ${after} ₪.\nטיפ: ${after} ÷ 10 = ${tip} ₪.\nלתשלום: ${after} + ${tip} = ${after+tip} ₪.`);});
add40(2,'takeaway-compare','אותו אוכל, מחיר כולל שונה','takeaway-vs-table',l=>{const food=P([100,150,200]),delivery=P([20,30]),tip=food/10;return money40(`אותו אוכל עולה ${food} ₪. במשלוח מוסיפים ${delivery} ₪, בלי תוספות אחרות. במסעדה מוסיפים טיפ של 10%, בלי תוספות אחרות. בכמה המשלוח יקר יותר?`,delivery-tip,`טיפ במסעדה: ${food} ÷ 10 = ${tip} ₪.\nהמחיר הבסיסי זהה.\nההפרש בתוספות: ${delivery} − ${tip} = ${delivery-tip} ₪.`,{step:5});});
add40(2,'weekly-home','מסעדה אחת פחות בכל שבוע','weekly-saving-after-home',l=>{const out=P([100,120]),home=P([10,20]),weeks=P([4,5]);return money40(`במשך ${weeks} שבועות מחליפה בכל שבוע מנה במסעדה ב־${out} ₪ במנה בבית ב־${home} ₪. כמה כסף נשאר יותר אחרי שקונים גם את המצרכים לבית?`,(out-home)*weeks,`חיסכון בשבוע: ${out} − ${home} = ${out-home} ₪.\nבכל התקופה: ${out-home} × ${weeks} = ${(out-home)*weeks} ₪.`);});
add40(2,'picnic-hotel','טיול יום עם אוכל וכניסה','outing-all-costs',l=>{const hotel=P([700,1000]),food=50,entry=P([40,60]),travel=40;return money40(`לילה במלון עולה ${hotel} ₪. טיול יום חלופי: אוכל מהבית ${food} ₪, כניסה ${entry} ₪ ונסיעות ${travel} ₪. בכמה טיול היום זול ממחיר הלילה לבדו?`,hotel-food-entry-travel,`טיול היום: ${food} + ${entry} + ${travel} = ${food+entry+travel} ₪.\nההפרש: ${hotel} − ${food+entry+travel} = ${hotel-food-entry-travel} ₪.`,{nudge:'אפשר ליהנות מהיציאה גם בלי לשלם על לינה.'});});
add40(2,'menu-substitute','מנה התייקרה, שומרת גם טיפ','menu-substitution-tip',l=>{const budget=200,other=70,old=P([70,80]),replacement=old+20,bill=other+replacement,total=bill*11/10;return money40(`המנה שרצית ב־${old} ₪ אזלה. חלופה עולה ${replacement} ₪, ולצדה מנה ב־${other} ₪. מוסיפים טיפ של 10%. כמה נשאר מתקציב של ${budget} ₪?`,budget-total,`המנות: ${replacement} + ${other} = ${bill} ₪.\nהטיפ: ${bill} ÷ 10 = ${bill/10} ₪.\nיחד: ${bill} + ${bill/10} = ${total} ₪.\nנשאר: ${budget} − ${total} = ${budget-total} ₪.`);});
add40(2,'coffee-switch','קפה קנוי רק בחלק מהימים','mixed-week-cost',l=>{const days=5,bought=P([2,3]),price=20,home=2;return money40(`ב־${bought} מתוך ${days} ימי העבודה קונה קפה ב־${price} ₪. בשאר הימים מכינה בבית בעלות ${home} ₪ לכוס. כמה עולה הקפה בכל השבוע?`,bought*price+(days-bought)*home,`קפה קנוי: ${bought} × ${price} = ${bought*price} ₪.\nימים בבית: ${days} − ${bought} = ${days-bought}.\nקפה ביתי: ${days-bought} × ${home} = ${(days-bought)*home} ₪.\nיחד: ${bought*price} + ${(days-bought)*home} = ${bought*price+(days-bought)*home} ₪.`);});
add40(2,'visit-pass','מנוי לבילוי לפי ביקורים מתוכננים','pass-planned-visits',l=>{const visits=P([2,4]),ticket=50,pass=150;return choice(`כניסה למוזיאון עולה ${ticket} ₪. מנוי עולה ${pass} ₪ לתקופה שבה מתוכננים לך ${visits} ביקורים בלבד. מה זול יותר לביקורים שתכננת?`,visits*ticket<pass?'כרטיס נפרד לכל ביקור':'המנוי', [visits*ticket<pass?'המנוי':'כרטיס נפרד לכל ביקור','לקנות גם מנוי וגם כרטיסים','להוסיף ביקורים רק כדי להצדיק מנוי'],`כרטיסים נפרדים: ${visits} × ${ticket} = ${visits*ticket} ₪.\nהמנוי עולה ${pass} ₪.\nמשווה לפי הביקורים שמתוכננים באמת.`);});
add40(2,'shared-voucher','שובר וטיפ לא נעלמים בחלוקה','voucher-tip-split',l=>{const bill=P([200,300]),voucher=40,tip=bill/10;return money40(`חשבון לשני אנשים ${bill} ₪. שובר מוריד ${voucher} ₪. הוחלט לתת טיפ של 10% מהמחיר המקורי ולחלק את כל התשלום שווה. כמה לכל אחד?`,(bill-voucher+tip)/2,`אחרי השובר: ${bill} − ${voucher} = ${bill-voucher} ₪.\nטיפ: ${bill} ÷ 10 = ${tip} ₪.\nיחד: ${bill-voucher} + ${tip} = ${bill-voucher+tip} ₪.\nלכל אחד: ${bill-voucher+tip} ÷ 2 = ${(bill-voucher+tip)/2} ₪.`);});
add40(2,'bill-missing','בודקת גם סכום שנראה נמוך מדי','bill-missing-item',l=>{const food=P([80,90]),drink=10,shown=food,tip=(food+drink)/10;return money40(`אכלת מנה ב־${food} ₪ ושתית זירו ב־${drink} ₪. בחשבון מופיעה רק המנה. אחרי שמבקשים לתקן, מוסיפים טיפ של 10% על הכול. כמה משלמים?`,food+drink+tip,`החשבון הנכון: ${food} + ${drink} = ${food+drink} ₪.\nהטיפ: ${food+drink} ÷ 10 = ${tip} ₪.\nיחד: ${food+drink} + ${tip} = ${food+drink+tip} ₪.`,{nudge:'בודקת חשבון כדי שיהיה נכון לשני הצדדים.'});});
// Money: distinguish cash flows, future commitments and amounts available now.
add40(3,'pepper-plan','תקציב Pepper עם תוספת מתוכננת','daily-monthly-reserve',l=>{const daily=P([40,50]),days=30,extra=300,reserved=P([300,400]);return money40(`בחודש של ${days} ימים הועברו ל־Pepper ${daily} ₪ ביום ועוד ${extra} ₪ פעם אחת. כבר שמרת ${reserved} ₪ לעיסוי. כמה מהתקציב נשאר לשאר הפינוקים?`,daily*days+extra-reserved,`ההעברות היומיות: ${daily} × ${days} = ${daily*days} ₪.\nעם התוספת: ${daily*days} + ${extra} = ${daily*days+extra} ₪.\nלשאר הפינוקים: ${daily*days+extra} − ${reserved} = ${daily*days+extra-reserved} ₪.`);});
add40(3,'stb-topups','STB אחרי טעינות ותשלום קבוע','card-fees-net-topup',l=>{const topups=P([2,3,4]),each=100;return money40(`בנתוני הכרטיס שלך, כל טעינת STB דרך אשראי עולה עוד 3 ₪, ויש תשלום חודשי של 12 ₪. ביצעת ${topups} טעינות של ${each} ₪. כמה יצא מהחשבון כולל התוספות?`,topups*each+topups*3+12,`לכרטיס: ${topups} × ${each} = ${topups*each} ₪.\nעל הטעינות: ${topups} × 3 = ${topups*3} ₪.\nהתוספות יחד: ${topups*3} + 12 = ${topups*3+12} ₪.\nסך הכול: ${topups*each} + ${topups*3+12} = ${topups*each+topups*3+12} ₪.`,{note:'אלה תנאי הכרטיס שנמסרו לדוגמה; אין כאן בדיקת תעריפון עדכני.'});});
add40(3,'sevilla-gap','כמה חודשים נשארו לסביליה','goal-existing-savings-ceiling',l=>{const goal=8000,saved=P([4000,5000,6000]),monthly=500;return count(`לטיול בסביליה מתוכננים ${goal} ₪. כבר שמרת ${saved} ₪, ומוסיפה ${monthly} ₪ בחודש מכסף פנוי. כמה חודשים נוספים צריך, בלי להניח רווח?`,(goal-saved)/monthly,`הסכום שחסר: ${goal} − ${saved} = ${goal-saved} ₪.\nהחודשים: ${goal-saved} ÷ ${monthly} = ${(goal-saved)/monthly}.`,'חודשים',{nudge:'מחליפה הוצאה מיותרת בסכום קטן וקבוע למטרה שלך.'});});
add40(3,'pension-flows','כמה מהעלייה נבע מההשקעות?','growth-minus-deposits',l=>{const start=100000,deposit=P([6000,8000]),gain=P([4000,6000]),end=start+deposit+gain;return money40(`בחיסכון היו ${start} ₪. בסוף התקופה יש ${end} ₪, ומתוכם ${deposit} ₪ הם הפקדות חדשות. אין משיכות או עלויות בשאלה. כמה מהעלייה נבע מההשקעות?`,gain,`העלייה הכוללת: ${end} − ${start} = ${end-start} ₪.\nמורידה הפקדות: ${end-start} − ${deposit} = ${gain} ₪.`,{step:1000,note:'נתונים להמחשה; אין הבטחת תשואה.'});});
add40(3,'gain-loss','חודש של עלייה וחודש של ירידה','investment-gain-loss',l=>{const start=7500,gain=P([300,400]),loss=P([100,200]);return money40(`בחיסכון היו ${start} ₪. בחודש אחד שוויו עלה ב־${gain} ₪, ובחודש הבא ירד ב־${loss} ₪. אין הפקדות או משיכות. מה השווי כעת?`,start+gain-loss,`אחרי העלייה: ${start} + ${gain} = ${start+gain} ₪.\nאחרי הירידה: ${start+gain} − ${loss} = ${start+gain-loss} ₪.`,{step:100,nudge:'עלייה בחודש אחד אינה מבטיחה עלייה גם בחודש הבא.'});});
add40(3,'extra-work-net','מה נשאר מהשעות הנוספות','work-income-extra-cost',l=>{const hours=2,days=P([2,3]),rate=P([35,40]),food=20;return money40(`נשארת בעבודה עוד ${hours} שעות בכל אחד מ־${days} ימים. לכל שעה נוספת משלמים ${rate} ₪. על אוכל נוסף הוצאת יחד ${food} ₪. כמה נשאר מהתוספת לפני ניכויי שכר?`,hours*days*rate-food,`השעות הנוספות: ${hours} × ${days} = ${hours*days}.\nהתוספת: ${hours*days} × ${rate} = ${hours*days*rate} ₪.\nאחרי האוכל: ${hours*days*rate} − ${food} = ${hours*days*rate-food} ₪.`);});
add40(3,'two-commitments','שתי התחייבויות על אותו תקציב','future-two-commitments',l=>{const budget=P([400,500]),a=150,b=100,offer=200,free=budget-a-b;return choice(`בחודש הבא ${budget} ₪ לפינוקים. כבר התחייבת ל־${a} ₪ ול־${b} ₪. מוצע מנוי נוסף ב־${offer} ₪ בחודש. האם הוא נכנס בלי לחרוג?`,free>=offer?'כן, לפי הסכומים בשאלה':'לא, אין מספיק כסף פנוי',[free>=offer?'לא, אין מספיק כסף פנוי':'כן, לפי הסכומים בשאלה','כן, אם החיוב מתחיל מאוחר יותר','לא צריך לספור תשלומים שכבר סוכמו'],`כבר התחייבת: ${a} + ${b} = ${a+b} ₪.\nפנוי: ${budget} − ${a+b} = ${free} ₪.\nמשווה את ${offer} ₪ למקום שנשאר.`,{nudge:'גם אם יש מקום בתקציב, בודקת אם המנוי רצוי ומה תנאי הביטול.'});});
add40(3,'separate-reserve','בחיסכון יש כסף, אבל חלקו שמור','available-after-reserves',l=>{const balance=7500,rent=P([3000,4000]),urgent=1000;return money40(`בחיסכון זמין ${balance} ₪. ${rent} ₪ שמורים לשכר דירה ועוד ${urgent} ₪ להוצאה חיונית קרובה. כמה נשאר מעבר לשני הסכומים השמורים?`,balance-rent-urgent,`הסכומים השמורים: ${rent} + ${urgent} = ${rent+urgent} ₪.\nמעבר להם: ${balance} − ${rent+urgent} = ${balance-rent-urgent} ₪.`,{step:500,nudge:'יתרה בחשבון אינה אומרת שכל הכסף פנוי לפינוק.'});});
add40(3,'dollar-fee','מחיר בדולרים עם עלות נוספת','currency-plus-fee',l=>{const dollars=P([100,200,300]),fee=30;return money40(`קנייה מתוכננת עולה ${dollars} דולר ועוד תשלום קבוע של ${fee} ₪. בשאלה דולר אחד שווה 3 ₪. כמה שקלים צריך בסך הכול?`,dollars*3+fee,`המחיר בשקלים: ${dollars} × 3 = ${dollars*3} ₪.\nכולל התוספת: ${dollars*3} + ${fee} = ${dollars*3+fee} ₪.`,{note:'שער קבוע לחשבון בלבד, לא שער חליפין עדכני.'});});
add40(3,'unexpected-bill','הוצאה חיונית משנה את החיסכון החודשי','saving-after-unexpected',l=>{const free=P([600,700,800]),planned=500,urgent=P([200,300]);return money40(`אחרי ההוצאות הרגילות נשארו ${free} ₪. רצית לשמור ${planned} ₪, אבל נוספה הוצאה חיונית של ${urgent} ₪. כמה אפשר לשמור לכל היותר בלי להיכנס לחוב?`,free-urgent,`קודם ההוצאה החיונית: ${free} − ${urgent} = ${free-urgent} ₪.\nזה הסכום שנותר לחיסכון בלי ללוות.`,{nudge:'תוכנית חיסכון יכולה להשתנות בחודש חריג; לא לוקחת הלוואה כדי לעמוד בה.'});});
// Time: whole routes, rest and several constraints, with ample travel margins.
add40(4,'work-grandma-rest','מחשבת את זמן המנוחה אחרי הדרך','arrival-rest-walk',l=>{const start=P([840,900]),trip=120,classAt=1125,walk=15,spare=60,rest=classAt-walk-spare-start-trip;return duration(`ברביעי מסיימת בבת ים ב־${time(start)} ונוסעת ישר לסבתא בהרצליה, שעתיים בדרך. הפלמנקו ב־18:45. שומרת רבע שעה להליכה ועוד שעה ספייר. כמה דקות נשארות למנוחה אצל סבתא?`,rest,`מגיעה לסבתא ב־${time(start+trip)}.\nרבע שעה הליכה ושעה ספייר: 15 + 60 = 75 דקות.\nהמנוחה מסתיימת עד ${time(classAt-75)}.\nמ־${time(start+trip)} עד ${time(classAt-75)} יש ${rest} דקות.`,{note:plan40});});
add40(4,'overtime-departure','עוד עבודה בלי לפספס יציאה','overtime-deadline-fit',l=>{const day=P(['שני','רביעי']),classAt=day==='שני'?1245:1125,trip=120,walk=15,spare=60,leave=classAt-trip-walk-spare,end=P([900,960]);return choice(`ביום ${day} הפלמנקו ב־${time(classAt)}. מתכננת שעתיים מהעבודה לסבתא, רבע שעה הליכה ושעה ספייר. מציעים לעבוד עד ${time(end)}. האם זה מאפשר לצאת בזמן לפי התוכנית?`,end<=leave?'כן, שעת הסיום לפני שעת היציאה':'לא, צריך לסיים מוקדם יותר',[end<=leave?'לא, צריך לסיים מוקדם יותר':'כן, שעת הסיום לפני שעת היציאה','אפשר לסמוך על מונית בלי לבדוק','אין צורך לכלול את ההליכה'],`כל הזמן שצריך: 120 + 15 + 60 = 195 דקות.\nשעת היציאה האחרונה לפי התוכנית: ${time(leave)}.\nמשווה אליה את סיום העבודה ב־${time(end)}.`,{note:plan40});});
add40(4,'earlier-shift','משמרת מוקדמת משנה גם את השינה','shift-wake-bedtime',l=>{const work=P([435,450,465,480]),walk=20,prep=30,sleep=9,wake=work-walk-prep,bed=1440+wake-sleep*60;return clock(`מחר העבודה ב־${time(work)}. צריך 20 דקות הליכה וחצי שעה להתארגנות וקפה. רוצה לשמור על 9 שעות שינה. מתי להיות כבר ישנה הלילה?`,bed,`הכנות והליכה: 30 + 20 = 50 דקות.\nקימה ב־${time(wake)}.\nתשע שעות קודם: ${time(bed)} בערב.`,{nudge:'שעת עבודה חדשה מחייבת לעדכן גם את תוכנית הלילה.'});});
add40(4,'episode-cost','כמה פרקים מתאימים לפני שעת השינה?','episodes-sleep-loss',l=>{const available=P([40,50,60]),prep=10,episode=P([20,30]),countEpisodes=Math.floor((available-prep)/episode);return count(`נשארו ${available} דקות עד שעת השינה שתכננת כדי לישון 9 שעות. צריכה 10 דקות להתארגן, וכל פרק נמשך ${episode} דקות. כמה פרקים שלמים אפשר לראות בלי לדחות את השינה?`,countEpisodes,`לצפייה נשארות: ${available} − 10 = ${available-10} דקות.\n${countEpisodes} פרקים נמשכים ${countEpisodes*episode} דקות ונכנסים בזמן.\nפרק נוסף יביא ל־${(countEpisodes+1)*episode} דקות, יותר מהזמן הפנוי.`,'פרקים',{nudge:'עוצרת בזמן שקבעת; הפרקים הבאים יחכו למחר.'});});
add40(4,'bus-delay-buffer','העיכוב אכל חלק מהספייר','two-delays-buffer',l=>{const a=P([10,20]),b=P([10,15]),spare=60;return duration(`בדרך לסבתא שמרת שעה ספייר, מעבר לנסיעה ולהליכה. האוטובוס התעכב ${a} דקות וההחלפה הוסיפה ${b} דקות. כמה דקות ספייר נשארו?`,spare-a-b,`שעה היא 60 דקות.\nהעיכובים יחד: ${a} + ${b} = ${a+b} דקות.\nנשארו: 60 − ${a+b} = ${60-a-b} דקות.`,{nudge:'הספייר עוזר כשמשהו משתנה; לא מתחילה להסתמך על ריצה או מונית.'});});
add40(4,'tasks-overlap','שתי הכנות שאפשר לעשות יחד','parallel-preparation',l=>{const charge=P([20,30]),bag=10,food=10;return duration(`הטלפון צריך ${charge} דקות טעינה. באותו זמן אפשר להכין תיק ב־${bag} דקות ואחריו אוכל ב־${food} דקות. כמה זמן צריך עד שגם הטלפון וגם ההכנות מוכנים?`,Math.max(charge,bag+food),`תיק ואוכל: ${bag} + ${food} = ${bag+food} דקות.\nהטעינה מתרחשת במקביל.\nלוקחת את הזמן הארוך: ${Math.max(charge,bag+food)} דקות.`);});
add40(4,'week-paid','שעות בתשלום אחרי הפסקות','weekly-paid-breaks',l=>{const days=P([4,6]),hours=7,total=days*7-days/2;return count(`עבדת ${days} ימים, בכל יום 7 שעות כולל הפסקה של חצי שעה שאינה בתשלום. כמה שעות עבודה בתשלום היו בכל התקופה?`,total,`כל השעות: ${days} × 7 = ${days*7} שעות.\nשתי הפסקות של חצי שעה הן שעה.\nסך ההפסקות: ${days} ÷ 2 = ${days/2} שעות.\nבתשלום: ${days*7} − ${days/2} = ${total} שעות.`,'שעות',{note:'אופן התשלום נתון לשאלה בלבד.'});});
add40(4,'appointment-buffer','מרווח בין סיום פגישה ליציאה','appointment-exit-gap',l=>{const start=P([780,810]),meeting=45,leave=960,prep=15;return duration(`פגישה מתחילה ב־${time(start)} ונמשכת 45 דקות. צריך לצאת לדרך ב־16:00, ולפני היציאה 15 דקות להתארגנות. כמה דקות פנויות יש אחרי הפגישה?`,leave-prep-start-meeting,`הפגישה מסתיימת ב־${time(start+meeting)}.\nמתחילה להתארגן ב־15:45.\nמ־${time(start+meeting)} עד 15:45 יש ${leave-prep-start-meeting} דקות.`);});
add40(4,'missed-connection','החלפה שפספסנו משנה את ההגעה','connection-next-arrival',l=>{const planned=1020,wait=P([20,30]),trip=40;return clock(`תכננת להתחיל את החלק האחרון בדרך לסבתא ב־17:00. ההחלפה התפספסה, והיציאה הבאה בעוד ${wait} דקות. החלק שנותר בדרך נמשך 40 דקות. מתי תגיעי לפי הנתונים?`,planned+wait+trip,`היציאה החדשה: ${time(planned+wait)}.\nמוסיפה 40 דקות בדרך.\nהגעה לסבתא: ${time(planned+wait+trip)}.`,{note:plan40,nudge:'כשההגעה משתנה, בודקת מחדש כמה מרווח נשאר עד החוג.'});});
add40(4,'rest-deadline','תזכורת לפני שקמים מהמנוחה','rest-alarm-prep-walk',l=>{const classAt=P([1125,1245]),walk=15,prep=P([10,20]),early=15;return clock(`את כבר אצל סבתא ליד הפלמנקו. השיעור ב־${time(classAt)}. רוצה להגיע רבע שעה קודם; ההליכה רבע שעה וההתארגנות ${prep} דקות. מתי התזכורת לקום מהמנוחה?`,classAt-walk-prep-early,`הגעה רצויה: ${time(classAt-early)}.\nיוצאת להליכה ב־${time(classAt-early-walk)}.\nקמה ומתארגנת ב־${time(classAt-early-walk-prep)}.`,{nudge:'מכוונת את התזכורת לפני שנחים, כשהדרך הארוכה כבר מאחורייך.'});});
// Professional sport: planning, transparent fees and differences from stated observations.
add40(5,'free-first-balance','מפגש חינם ומה נשאר לתשלום','series-free-deposit',l=>{const total=8,paid=P([200,300]),price=100;return money40(`סוכמו 8 מפגשים. הראשון חינם, וכל אחד מ־7 הבאים עולה ${price} ₪. כבר שולמו ${paid} ₪. כמה נשאר לשלם לפי ההסכם?`,7*price-paid,`סך התשלום: 7 × ${price} = 700 ₪.\nנשאר: 700 − ${paid} = ${700-paid} ₪.`,{nudge:'מסכמת מראש את כל העלות, תנאי הביטול ומה שכבר שולם.'});});
add40(5,'two-sessions-gap','ספייר אמיתי אחרי רישום והכנת החדר','sessions-break-prep',l=>{const start=P([540,600]),session=45,next=start+P([105,120]),prep=15,gap=next-start-session-prep;return duration(`מפגש מתחיל ב־${time(start)} ונמשך 45 דקות. הבא מתחיל ב־${time(next)}. אחרי הראשון צריכה 15 דקות לרישום ולהכנת החדר. כמה דקות נשארות למנוחה בין המפגשים?`,gap,`הראשון מסתיים ב־${time(start+45)}.\nהרישום וההכנה מסתיימים ב־${time(start+60)}.\nעד ${time(next)} נשארות ${gap} דקות למנוחה.`);});
add40(5,'plan-feasibility','כמה תחנות מתאימות עם הפסקות?','stations-rest-feasibility',l=>{const total=60,opening=5,rest=P([5,15]),station=10;return count(`מפגש נמשך שעה. שומרת 5 דקות לפתיחה ולסיכום יחד, ועוד ${rest} דקות להפסקות. כל תחנה 10 דקות. כמה תחנות אפשר לקיים בלי להאריך?`,(total-opening-rest)/station,`שעה היא 60 דקות.\nלפתיחה ולהפסקות: 5 + ${rest} = ${5+rest} דקות.\nלפעילות: 60 − ${5+rest} = ${55-rest} דקות.\nתחנות: ${55-rest} ÷ 10 = ${(55-rest)/10}.`,'תחנות');});
add40(5,'late-session','איחור מצמצם את הספייר למפגש הבא','late-session-gap',l=>{const booked=75,late=P([10,15]),session=45,prep=10;return duration(`בין שעת ההתחלה שתוכננה לבין המפגש הבא יש 75 דקות. המשפחה איחרה ${late} דקות. מקיימים מפגש של 45 דקות ושומרים 10 דקות להכנת החדר. כמה דקות ספייר יישארו עד המשפחה הבאה?`,booked-late-session-prep,`אחרי האיחור: 75 − ${late} = ${75-late} דקות.\nמפגש והכנה: 45 + 10 = 55 דקות.\nהספייר שנותר: ${75-late} − 55 = ${20-late} דקות.`,{nudge:'בודקת את הזמן לפני שמאריכה, כדי לא לעכב את המשפחה הבאה.'});});
add40(5,'two-age-gaps','שתי יכולות, שני הפרשי זמן','two-observation-gaps',l=>{const age=P([18,20]),a=12,b=15;return choice(`ילד בן ${age} חודשים. במעקב המתואר רצו לבדוק עמידה בתמיכה בגיל שנה, והליכה בגיל 15 חודשים. הוא עדיין לא מבצע אותן. כמה חודשים חלפו מכל מועד שנקבע?`,`לעמידה: ${age-a}; להליכה: ${age-b}`,[`לעמידה: ${age-b}; להליכה: ${age-a}`,`משתיהן: ${age-a} חודשים`,`משתיהן: ${age-b} חודשים`],`שנה היא 12 חודשים.\nלעמידה: ${age} − 12 = ${age-12} חודשים.\nלהליכה: ${age} − 15 = ${age-15} חודשים.`,{note:'אלה הפרשים מגילים נתונים, לא מדידת חומרה או אבחון של עיכוב.'});});
add40(5,'progress-gap','השוואת שתי תצפיות לאורך זמן','observations-change-gap',l=>{const before=P([2,3]),after=before+2,target=6;return count(`בתצפית קודמת הילד השלים ${before} מתוך ${target} פעולות שנבחרו למעקב. כעת השלים ${after} מתוך אותן ${target}. בכמה קטן מספר הפעולות שעדיין לא הושלמו?`,after-before,`קודם חסרו: ${target} − ${before} = ${target-before}.\nכעת חסרות: ${target} − ${after} = ${target-after}.\nהפער קטן ב־${target-before} − ${target-after} = ${after-before} פעולות.`,'פעולות',{note:'מתארים את התצפית בלבד, בלי לקבוע אבחנה מהמספר.'});});
add40(5,'home-plan-flex','תוכנית ביתית אחרי יום שהוחמץ','home-minutes-plan-change',l=>{const days=P([4,5]),per=10,done=days-1;return duration(`בתוכנית שסוכמה עם ההורה יש ${days} ימים של פעילות, 10 דקות בכל יום. יום אחד לא התאפשר ולא משלימים אותו בכפייה. כמה דקות בוצעו בשאר הימים?`,done*per,`הימים שבוצעו: ${days} − 1 = ${done}.\nהדקות: ${done} × 10 = ${done*10}.`,{nudge:'מעדכנים את הרישום וממשיכים בתוכנית המתאימה לילד, בלי להעמיס כדי למחוק פספוס.'});});

});
